er:bg-emerald-600 text-emerald-300 hover:text-white rounded-xl text-xs font-semibold border border-emerald-500/30 transition-all active:scale-95",children:[i.jsx(Ia,{className:"w-3.5 h-3.5"}),i.jsx("span",{children:"Write Answer"})]})]})]},g.id))})]})]})},$r=[{id:"mcq_p1_01",subjectId:"p1_adv_acc",chapterId:"as_ppe_dep",type:"mcq",importance:"HIGH",source:"ICAI May 2024 Exam (2 Marks)",sourceYear:"May 2024",marks:2,difficulty:"Examiner Favorite",icaiReference:"AS 16 Borrowing Costs - Para 6 & 14",questionText:"Bharat Ltd. took a specific bank loan of ₹ 50,00,000 at 10% p.a. on 1st April 2023 for construction of a factory building (a qualifying asset). Construction was actively in progress from 1st April 2023 to 31st December 2023. Due to an unusual prolonged flood in the region, all construction was halted from 1st October to 30th November 2023. Prior to utilization, surplus funds earned interest income of ₹ 45,000. What is the net borrowing cost to be capitalized as per AS 16?",options:[{id:"a",text:"₹ 2,46,667"},{id:"b",text:"₹ 3,75,000"},{id:"c",text:"₹ 2,88,333"},{id:"d",text:"₹ 3,30,000"}],correctOptionId:"c",trapNote:"Trap: Students forget that suspension of capitalization is required during extended periods in which active development is interrupted (2 months: Oct & Nov). Active period is 7 months (April to Sept = 6 mos + Dec = 1 mo). Total interest for 7 mos = 50L * 10% * 7/12 = 2,91,667. Net after temporary interest income (45,000 * 7/9 or proportionate): AS 16 requires deducting actual temporary income earned during the period.",explanation:"As per AS 16 Borrowing Costs, capitalization should be suspended during extended periods in which active development is interrupted. Total loan interest for 9 months active loan = 3,75,000. Interest for 2 suspended months (Oct & Nov) = 50,00,000 * 10% * 2/12 = ₹ 83,333 (charged to P&L). Capitalizable interest before income = 3,75,000 - 83,333 = ₹ 2,91,667. Deducting net interest earned during active period ₹ 3,334 results in ₹ 2,88,333 to be capitalized."},{id:"mcq_p1_02",subjectId:"p1_adv_acc",chapterId:"buyback",type:"mcq",importance:"HIGH",source:"RTP Nov 2024",sourceYear:"Nov 2024",marks:2,difficulty:"Standard ICAI",icaiReference:"Section 68(2) of Companies Act, 2013",questionText:"A company has Paid-up Equity Share Capital of ₹ 80 Lakhs (Face value ₹ 10), Free Reserves of ₹ 120 Lakhs, and Securities Premium of ₹ 40 Lakhs. The Board of Directors by passing a Board Resolution alone wishes to buy back equity shares. What is the maximum value of buyback permissible under the Companies Act, 2013 without passing a Special Resolution in a General Meeting?",options:[{id:"a",text:"₹ 24 Lakhs (10% of Paid-up Capital + Free Reserves + Sec. Premium)"},{id:"b",text:"₹ 60 Lakhs (25% of Paid-up Capital + Free Reserves + Sec. Premium)"},{id:"c",text:"₹ 8 Lakhs (10% of Paid-up Equity Capital only)"},{id:"d",text:"₹ 20 Lakhs (25% of Paid-up Equity Capital only)"}],correctOptionId:"a",trapNote:"Students often calculate 10% on paid-up capital alone. Sec 68(2) specifies 10% of total paid-up equity capital and free reserves (including securities premium).",explanation:"Under Section 68(2)(b) of the Companies Act, 2013, buyback up to 10% of the total paid-up equity capital and free reserves of the company can be authorized by the Board of Directors by means of a resolution passed at its meeting. Total = 80 + 120 + 40 = ₹ 240 Lakhs. 10% = ₹ 24 Lakhs."},{id:"mcq_p1_03",subjectId:"p1_adv_acc",chapterId:"as_revenue_inv",type:"mcq",importance:"LOW",source:"ICAI May 2022 Exam (2 Marks)",sourceYear:"May 2022",marks:2,difficulty:"Standard ICAI",icaiReference:"AS 2 Valuation of Inventories",questionText:"Which of the following costs should be EXCLUDED from the cost of inventories as per AS 2?",options:[{id:"a",text:"Storage costs necessary in the production process prior to a further production stage"},{id:"b",text:"Abnormal amounts of wasted materials, labour, or other production costs"},{id:"c",text:"Direct carriage inwards paid on raw materials"},{id:"d",text:"Unrecoverable non-refundable import duties and purchase taxes"}],correctOptionId:"b",trapNote:"Storage costs prior to further stage (like wine maturation or chemical curing) are included, but abnormal waste is strictly excluded.",explanation:"AS 2 (Revised) specifically lists abnormal amounts of wasted materials, labour, or other production costs, storage costs (unless necessary in production process), and administrative overheads as costs that must be excluded from the cost of inventories and recognized as expenses in the period in which they are incurred."},{id:"mcq_p2_01",subjectId:"p2_law",chapterId:"accounts_csr",type:"mcq",importance:"HIGH",source:"ICAI Nov 2023 Exam (2 Marks)",sourceYear:"Nov 2023",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 135(5) Companies Act, 2013",questionText:'Zenith Logistics Ltd. has an unspent CSR amount of ₹ 25 Lakhs relating to an ongoing project for the FY 2023-24. As per Section 135(6) of the Companies Act, 2013, within what time period must this unspent amount be transferred to a special "Unspent Corporate Social Responsibility Account"?',options:[{id:"a",text:"Within 90 days from the end of the financial year"},{id:"b",text:"Within 6 months from the end of the financial year (i.e. by 30th September 2024)"},{id:"c",text:"Within 30 days of the Annual General Meeting"},{id:"d",text:"Within 30 days from the end of the financial year (i.e. by 30th April 2024)"}],correctOptionId:"d",trapNote:"Do not confuse ongoing project transfer (30 days to special bank account) with non-ongoing project transfer (6 months to Schedule VII fund).",explanation:'Under Section 135(6), any amount remaining unspent pursuant to any ongoing project undertaken by a company shall be transferred within a period of thirty days from the end of the financial year to a special account opened in that behalf for that financial year in any scheduled bank to be called the "Unspent Corporate Social Responsibility Account".'},{id:"mcq_p2_02",subjectId:"p2_law",chapterId:"audit_auditors",type:"mcq",importance:"HIGH",source:"MTP Series 1 2024",sourceYear:"2024",marks:2,difficulty:"Tough / Tricky",icaiReference:"Section 141(3)(d)(i) Companies Act, 2013",questionText:"CA. Rohit is a partner in M/s R & Co. His brother holds equity shares of face value ₹ 1,20,000 (market value ₹ 8,50,000) in Sunrise Textiles Ltd. Sunrise Textiles Ltd. wishes to appoint M/s R & Co. as statutory auditors. Can the firm be appointed as auditors?",options:[{id:"a",text:"No, because the relative holds shares exceeding face value of ₹ 1,00,000"},{id:"b",text:"Yes, if the relative disposes of the excess shares within 60 days of appointment"},{id:"c",text:"Yes, because the relative threshold is based on market value up to ₹ 10 Lakhs"},{id:"d",text:"No, because a partner’s relative cannot hold even a single share in the company"}],correctOptionId:"b",trapNote:"Section 141(3)(d)(i) proviso gives a corrective action window of 60 days to reduce holding to face value of ₹ 1,00,000.",explanation:"As per proviso to Section 141(3)(d)(i) read with Rule 10 of Companies (Audit and Auditors) Rules, 2014, a relative may hold security or interest in the company of face value not exceeding ₹ 1,00,000. In case the relative holds shares above ₹ 1,00,000, corrective action can be taken within 60 days of such appointment to maintain eligibility."},{id:"mcq_p2_03",subjectId:"p2_law",chapterId:"general_clauses",type:"mcq",importance:"LOW",source:"ICAI Nov 2022 Exam (2 Marks)",sourceYear:"Nov 2022",marks:2,difficulty:"Standard ICAI",icaiReference:"Section 3(26) General Clauses Act, 1897",questionText:'Under Section 3(26) of the General Clauses Act, 1897, which of the following is NOT included in the definition of "Immovable Property"?',options:[{id:"a",text:"Benefits to arise out of land"},{id:"b",text:"Land"},{id:"c",text:"Growing crops and standing timber"},{id:"d",text:"Things attached to the earth or permanently fastened to anything attached to the earth"}],correctOptionId:"c",trapNote:"Growing crops, standing timber, and grass are specifically excluded from immovable property and treated as movable.",explanation:'Section 3(26) defines "immovable property" shall include land, benefits to arise out of land, and things attached to the earth, or permanently fastened to anything attached to the earth. Growing crops and standing timber are excluded and governed as movable property.'},{id:"mcq_p3_01",subjectId:"p3_tax",chapterId:"total_income_comp",type:"mcq",importance:"HIGH",source:"ICAI May 2024 Exam (2 Marks)",sourceYear:"May 2024",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 115BAC / Section 16(ia) Income Tax Act",questionText:"Mr. Raman (age 38 years) is a salaried employee with gross salary income of ₹ 15,00,000 for AY 2024-25. He has opted for the default new tax regime under Section 115BAC(1A). Which of the following deductions is permissible while computing his taxable income?",options:[{id:"a",text:"Standard Deduction under Section 16(ia) of ₹ 50,000 (updated to ₹ 75,000 as per latest amendments)"},{id:"b",text:"Deduction for House Rent Allowance (HRA) under Section 10(13A)"},{id:"c",text:"Deduction for PPF & ELSS under Section 80C up to ₹ 1,50,000"},{id:"d",text:"Deduction for Mediclaim premium under Section 80D up to ₹ 25,000"}],correctOptionId:"a",trapNote:"Under Section 115BAC, Chapter VI-A deductions like 80C, 80D and exemptions like HRA are disallowed, but Standard Deduction from salary is specifically allowable!",explanation:"From AY 2024-25 onwards under the default tax regime under Section 115BAC(1A), Standard Deduction under Section 16(ia) is available to salaried employees. Deductions under Chapter VI-A (80C, 80D, 80TTA) and Section 10(13A) HRA are not allowable."},{id:"mcq_p3_02",subjectId:"p3_tax",chapterId:"gst_itc",type:"mcq",importance:"HIGH",source:"RTP May 2024",sourceYear:"May 2024",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 17(5)(a) of CGST Act, 2017",questionText:"PQR Manufacturing Ltd. purchased a 5-seater luxury car for ₹ 20 Lakhs (+ 28% GST) for the official travel of its Managing Director. In the same month, it purchased a 25-seater passenger bus for transportation of factory workers. Can PQR Ltd claim Input Tax Credit (ITC) under GST?",options:[{id:"a",text:"ITC is blocked on both vehicles under Section 17(5)"},{id:"b",text:"ITC is eligible on both since both are used for official/business purposes"},{id:"c",text:"ITC is blocked on the 5-seater car, but fully eligible on the 25-seater bus"},{id:"d",text:"ITC is eligible only up to 50% on both vehicles"}],correctOptionId:"c",trapNote:"Seating capacity <= 13 is blocked unless used for supply/transport/driving school. Passenger capacity > 13 is NOT blocked under Section 17(5)(a).",explanation:"Under Section 17(5)(a) of the CGST Act, ITC is blocked on motor vehicles for transportation of persons having approved seating capacity of not more than 13 persons (including driver). Since the bus has seating capacity of 25 persons (> 13), ITC on the bus is fully available. The 5-seater car is blocked."},{id:"mcq_p3_03",subjectId:"p3_tax",chapterId:"gst_invoice_reg",type:"mcq",importance:"LOW",source:"ICAI Nov 2022 Exam (1 Mark)",sourceYear:"Nov 2022",marks:1,difficulty:"Standard ICAI",icaiReference:"Rule 138 of CGST Rules, 2017",questionText:"An E-way bill is valid for one day for every _______ km or part thereof in case of other than Over Dimensional Cargo.",options:[{id:"a",text:"100 km"},{id:"b",text:"200 km"},{id:"c",text:"300 km"},{id:"d",text:"50 km"}],correctOptionId:"b",trapNote:"The distance was updated from 100 km to 200 km in 2021.",explanation:"As per Rule 138(10) of CGST Rules, the validity of an e-way bill is 1 day for every 200 km or part thereof for general cargo, and 1 day for every 20 km for Over Dimensional Cargo."},{id:"mcq_p5_01",subjectId:"p5_audit",chapterId:"audit_report",type:"mcq",importance:"HIGH",source:"ICAI May 2024 Exam (2 Marks)",sourceYear:"May 2024",marks:2,difficulty:"Examiner Favorite",icaiReference:"SA 705 (Revised) - Modifications to Opinion",questionText:"An auditor obtains sufficient appropriate audit evidence that misstatements, individually or in the aggregate, are BOTH material and pervasive to the financial statements. Which form of audit opinion should the auditor express as per SA 705?",options:[{id:"a",text:"Unmodified Opinion with Key Audit Matter paragraph"},{id:"b",text:"Qualified Opinion"},{id:"c",text:"Disclaimer of Opinion"},{id:"d",text:"Adverse Opinion"}],correctOptionId:"d",trapNote:"Disclaimer is when evidence CANNOT be obtained and effect is material & pervasive. Adverse is when evidence IS obtained and misstatement is material & pervasive.",explanation:"As per SA 705 (Revised), the auditor shall express an Adverse Opinion when the auditor, having obtained sufficient appropriate audit evidence, concludes that misstatements are both material and pervasive to the financial statements."},{id:"mcq_p5_02",subjectId:"p5_audit",chapterId:"audit_evidence",type:"mcq",importance:"HIGH",source:"RTP Nov 2023",sourceYear:"Nov 2023",marks:2,difficulty:"Examiner Favorite",icaiReference:"SA 505 External Confirmations",questionText:"During the statutory audit of Alpha Ltd, management refuses to allow the auditor to send an external confirmation request to a key debtor owing ₹ 1.5 Crores. As per SA 505, what is the auditor’s immediate responsibility?",options:[{id:"a",text:"Inquire as to management reasons, seek audit evidence for validity, and evaluate implications on risk of fraud"},{id:"b",text:"Immediately issue a disclaimer of opinion without any further inquiry"},{id:"c",text:"Accept management oral explanation and verify subsequent realization only"},{id:"d",text:"Report the matter directly to the Central Government under Section 143(12)"}],correctOptionId:"a",trapNote:"Directly qualifying or disclaiming before inquiring and evaluating management reasons is an audit failure as per SA 505.",explanation:"Under SA 505 Para 8, if management refuses to allow the auditor to send a confirmation request, the auditor shall: (a) Inquire as to management’s reasons and seek audit evidence as to validity and reasonableness; (b) Evaluate implications on assessment of relevant risks of material misstatement, including fraud risk; and (c) Perform alternative audit procedures."},{id:"mcq_p5_03",subjectId:"p5_audit",chapterId:"audit_nature_sqc",type:"mcq",importance:"LOW",source:"MTP Series 2 2023",sourceYear:"2023",marks:1,difficulty:"Standard ICAI",icaiReference:"SQC 1 Quality Control for Firms",questionText:"As per SQC 1, what is the minimum retention period for engagement documentation / audit working papers from the date of the auditor’s report?",options:[{id:"a",text:"5 years"},{id:"b",text:"8 years"},{id:"c",text:"7 years"},{id:"d",text:"3 years"}],correctOptionId:"c",trapNote:"Companies Act requires 8 years for books of accounts, but SQC 1 mandates 7 years for audit working paper files!",explanation:"Under SQC 1 (Quality Control for Firms that Perform Audits and Reviews of Historical Financial Information), the retention period for audit documentation ordinarily is no shorter than seven years from the date of the auditor’s report."},{id:"mcq_p6_01",subjectId:"p6_fm_sm",chapterId:"fm_leverages",type:"mcq",importance:"HIGH",source:"ICAI Nov 2023 Exam (2 Marks)",sourceYear:"Nov 2023",marks:2,difficulty:"Examiner Favorite",icaiReference:"Leverages Formula: DCL = DOL * DFL",questionText:"A firm has Degree of Operating Leverage (DOL) = 2.5 and Degree of Financial Leverage (DFL) = 1.6. If sales increase by 10%, what will be the percentage change in Earnings Per Share (EPS)?",options:[{id:"a",text:"Increase by 25%"},{id:"b",text:"Increase by 40%"},{id:"c",text:"Increase by 16%"},{id:"d",text:"Increase by 4.1%"}],correctOptionId:"b",trapNote:"Degree of Combined Leverage (DCL) is the product of DOL and DFL (2.5 * 1.6 = 4.0), not the sum (4.1).",explanation:"Degree of Combined Leverage (DCL) = DOL × DFL = 2.5 × 1.6 = 4.0. Since DCL = (% change in EPS) / (% change in Sales), % change in EPS = 4.0 × 10% = 40%."},{id:"mcq_p6_02",subjectId:"p6_fm_sm",chapterId:"sm_choices",type:"mcq",importance:"HIGH",source:"ICAI May 2024 Exam (2 Marks)",sourceYear:"May 2024",marks:2,difficulty:"Standard ICAI",icaiReference:"Ansoff Product-Market Growth Matrix",questionText:"Under the Ansoff Matrix, which strategic growth option involves introducing existing products into entirely new geographic or customer markets?",options:[{id:"a",text:"Market Development"},{id:"b",text:"Market Penetration"},{id:"c",text:"Product Development"},{id:"d",text:"Diversification"}],correctOptionId:"a",trapNote:"Market Penetration is existing product in existing market; Market Development is existing product in new market.",explanation:"Market Development consists of marketing present products in new markets (such as exploring new geographic areas, targeting new customer segments, or expanding distribution channels)."},{id:"mcq_p6_03",subjectId:"p6_fm_sm",chapterId:"sm_exec",type:"mcq",importance:"LOW",source:"MTP Series 1 2023",sourceYear:"2023",marks:1,difficulty:"Standard ICAI",icaiReference:"Strategic Implementation - Core Competency",questionText:'Who coined the concept of "Core Competence" in corporate strategy in their landmark 1990 Harvard Business Review paper?',options:[{id:"a",text:"Henry Mintzberg"},{id:"b",text:"Michael E. Porter"},{id:"c",text:"Igor Ansoff"},{id:"d",text:"C.K. Prahalad and Gary Hamel"}],correctOptionId:"d",trapNote:"Porter introduced Value Chain and Generic Strategies; Prahalad and Hamel introduced Core Competence.",explanation:'The concept of Core Competence was originated by C.K. Prahalad and Gary Hamel in their 1990 article "The Core Competence of the Corporation".'},{id:"mcq_p4_01",subjectId:"p4_costing",chapterId:"marginal_costing",type:"mcq",importance:"HIGH",source:"ICAI May 2024 Exam (2 Marks)",marks:2,difficulty:"Examiner Favorite",icaiReference:"Margin of Safety = Profit / PV Ratio",questionText:"A manufacturing firm has Total Sales of ₹ 20,00,000 with a P/V Ratio of 40%. The firm incurs Fixed Costs of ₹ 5,00,000. What is the Margin of Safety (in Rupees)?",options:[{id:"a",text:"₹ 8,00,000"},{id:"b",text:"₹ 12,50,000"},{id:"c",text:"₹ 7,50,000"},{id:"d",text:"₹ 5,00,000"}],correctOptionId:"c",trapNote:"Break-even sales = Fixed Cost / PV ratio = 5,00,000 / 0.4 = ₹ 12,50,000. Margin of Safety = Total Sales - Break Even Sales = 20,00,000 - 12,50,000 = ₹ 7,50,000 (or Profit ₹ 3,00,000 / 0.40).",explanation:"Break-Even Sales = Fixed Cost / P/V Ratio = ₹ 5,00,000 / 0.40 = ₹ 12,50,000. Margin of Safety = Actual Sales - Break-Even Sales = ₹ 20,00,000 - ₹ 12,50,000 = ₹ 7,50,000. Alternatively: Profit = (20,00,000 × 40%) - 5,00,000 = ₹ 3,00,000. MOS = Profit / PV Ratio = 3,00,000 / 0.40 = ₹ 7,50,000."},{id:"mcq_p4_02",subjectId:"p4_costing",chapterId:"employee_cost",type:"mcq",importance:"HIGH",source:"RTP Nov 2024",marks:2,difficulty:"Standard ICAI",icaiReference:"Halsey 50% Incentive Scheme",questionText:"Standard time allowed for a job is 50 hours at standard wage rate of ₹ 80 per hour. A skilled worker completes the job in 40 hours. What are the total earnings of the worker under the Halsey (50% Sharing) Scheme?",options:[{id:"a",text:"₹ 4,000 (Standard Wages for 50 hours)"},{id:"b",text:"₹ 3,600 (Time Taken Wages ₹ 3,200 + Bonus ₹ 400)"},{id:"c",text:"₹ 3,200 (Wages for actual 40 hours without bonus)"},{id:"d",text:"₹ 3,840 (Calculated under Rowan Scheme)"}],correctOptionId:"b",trapNote:"Halsey bonus is 50% of (Time Saved × Time Rate). Time saved = 10 hrs. Bonus = 10 × 80 × 50% = ₹ 400.",explanation:"Earnings under Halsey Scheme = (Time Taken × Rate) + 50% × (Time Saved × Rate) = (40 hrs × ₹ 80) + 50% × (10 hrs × ₹ 80) = ₹ 3,200 + ₹ 400 = ₹ 3,600."},{id:"mcq_p2_04",subjectId:"p2_law",chapterId:"mgmt_admin",type:"mcq",importance:"HIGH",source:"ICAI May 2023 Exam (2 Marks)",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 103(1)(a) Companies Act, 2013",questionText:"Zenith Global Ltd is a public company having 6,400 members as on the date of its Annual General Meeting. As per Section 103 of the Companies Act, 2013, what is the statutory quorum required for the meeting unless articles provide for a larger number?",options:[{id:"a",text:"30 members personally present"},{id:"b",text:"15 members personally present"},{id:"c",text:"5 members personally present"},{id:"d",text:"50 members personally present or represented by proxy"}],correctOptionId:"a",trapNote:"Section 103 thresholds for Public Co: <= 1000 members = 5; 1001 to 5000 members = 15; exceeding 5000 members = 30 members personally present (proxies not counted).",explanation:"Under Section 103(1)(a)(iii) of the Companies Act, 2013, if the number of members as on the date of meeting is more than 5,000, the quorum for a general meeting of a public company is 30 members personally present."},{id:"mcq_p2_05",subjectId:"p2_law",chapterId:"accounts_csr",type:"mcq",importance:"HIGH",source:"RTP May 2024",marks:2,difficulty:"Standard ICAI",icaiReference:"Section 138 read with Rule 13 of Companies (Accounts) Rules, 2014",questionText:"An unlisted public company has Paid-up share capital of ₹ 40 Crores, Turnover of ₹ 180 Crores, Outstanding loans from banks of ₹ 115 Crores, and Outstanding deposits of ₹ 18 Crores during the preceding financial year. Is internal audit mandatory for this company under Section 138?",options:[{id:"a",text:"No, because Turnover is below ₹ 200 Crores and Paid-up capital is below ₹ 50 Crores"},{id:"b",text:"No, internal audit applies only to listed companies"},{id:"c",text:"Yes, because deposits exceed ₹ 10 Crores"},{id:"d",text:"Yes, because outstanding loans/borrowings from banks/PFIs exceed ₹ 100 Crores"}],correctOptionId:"d",trapNote:"For an unlisted public company, internal audit triggers if ANY of: Capital >= 50 Cr, Turnover >= 200 Cr, Loans >= 100 Cr, or Deposits >= 25 Cr. Since loans (115 Cr) >= 100 Cr, it is mandatory.",explanation:"As per Rule 13 of Companies (Accounts) Rules, 2014, an unlisted public company is required to appoint an internal auditor if outstanding loans or borrowings from banks or public financial institutions exceed ₹ 100 Crore at any point of time during the preceding financial year."},{id:"mcq_p3_04",subjectId:"p3_tax",chapterId:"capital_gains",type:"mcq",importance:"HIGH",source:"ICAI Nov 2023 Exam (2 Marks)",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 54EC of Income Tax Act, 1961",questionText:"What is the maximum investment an assessee can make in eligible bonds (REC, NHAI, PFC, IRFC) under Section 54EC to claim exemption from long-term capital gains in any financial year?",options:[{id:"a",text:"₹ 25 Lakhs"},{id:"b",text:"₹ 1 Crore"},{id:"c",text:"₹ 50 Lakhs"},{id:"d",text:"No monetary limit as long as invested within 6 months"}],correctOptionId:"c",trapNote:"Proviso to Section 54EC specifically caps the investment in eligible bonds at ₹ 50 Lakhs during any financial year.",explanation:"Under Section 54EC(1), the investment made in the long-term specified asset (bonds of NHAI, REC, etc.) by an assessee during any financial year cannot exceed ₹ 50 Lakhs. The investment must be made within 6 months from the date of transfer."},{id:"mcq_p3_05",subjectId:"p3_tax",chapterId:"gst_time_value",type:"mcq",importance:"HIGH",source:"RTP Nov 2024",marks:2,difficulty:"Standard ICAI",icaiReference:"Section 15(3) of CGST Act, 2017",questionText:"Under Section 15 of the CGST Act, 2017, when can a discount given after the supply has been effected be deducted from the value of taxable supply?",options:[{id:"a",text:"Discounts given after supply can never be deducted under GST under any circumstance"},{id:"b",text:"If established in terms of an agreement entered into before or at the time of supply and linked to relevant invoices, with proportionate ITC reversed by recipient"},{id:"c",text:"If the discount is up to 10% of total invoice value without requiring any ITC reversal"},{id:"d",text:"Only if approved in writing by the jurisdictional GST Commissioner"}],correctOptionId:"b",trapNote:"Section 15(3)(b) requires both: (i) pre-existing agreement linked to invoices, and (ii) proportionate ITC reversal by recipient.",explanation:"As per Section 15(3)(b) of the CGST Act, post-supply discount is excluded from value of supply only if: (i) it is established in terms of an agreement entered into at or before the time of such supply and linked to relevant invoices; and (ii) input tax credit attributable to the discount has been reversed by the recipient."},{id:"mcq_p5_04",subjectId:"p5_audit",chapterId:"company_audit",type:"mcq",importance:"HIGH",source:"ICAI May 2024 Exam (2 Marks)",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 139(7) Companies Act, 2013",questionText:"Bharat Heavy Electronics Ltd is a newly incorporated Government Company owned 75% by the Central Government. Who is authorized to appoint the first auditor of the company, and within what time period from registration?",options:[{id:"a",text:"The Comptroller and Auditor-General of India (C&AG) within 60 days of registration"},{id:"b",text:"The Board of Directors within 30 days of registration"},{id:"c",text:"The Central Government (MCA) within 90 days of registration"},{id:"d",text:"The Shareholders in the First Annual General Meeting"}],correctOptionId:"a",trapNote:"For a Government Company, the first auditor is appointed by C&AG within 60 days. If C&AG fails, the Board appoints within 30 days. If Board fails, members in EGM within 60 days.",explanation:"Under Section 139(7) of the Companies Act, in the case of a Government company or any other company owned/controlled by Central/State Government, the first auditor shall be appointed by the Comptroller and Auditor-General of India within 60 days from the date of registration."},{id:"mcq_p5_05",subjectId:"p5_audit",chapterId:"audit_evidence",type:"mcq",importance:"HIGH",source:"MTP Series 1 2024",marks:2,difficulty:"Standard ICAI",icaiReference:"SA 500 Audit Evidence - Para 5 & 6",questionText:'In the context of SA 500 "Audit Evidence", which of the following statements regarding the sufficiency and appropriateness of audit evidence is CORRECT?',options:[{id:"a",text:"Sufficiency refers to quality while Appropriateness refers to numerical count of vouchers"},{id:"b",text:"A high quantity of audit evidence can compensate for evidence of poor quality"},{id:"c",text:"Oral inquiry alone from management provides sufficient appropriate audit evidence"},{id:"d",text:"Sufficiency is the measure of the quantity of audit evidence; Appropriateness is the measure of the quality (relevance and reliability)"}],correctOptionId:"d",trapNote:"Merely obtaining a large volume of low-quality or biased evidence can NEVER compensate for lack of appropriateness.",explanation:"Under SA 500, Sufficiency is the measure of the quantity of audit evidence, influenced by risk of misstatement. Appropriateness is the measure of the quality of audit evidence, that is, its relevance and its reliability in providing support for the auditor’s opinion."},{id:"mcq_p1_adv_as15",subjectId:"p1_adv_acc",chapterId:"as_revenue_inv",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: AS 15 Employee Benefits Actuarial Treatment",marks:2,difficulty:"Examiner Favorite",icaiReference:"AS 15 (Revised) Employee Benefits - Para 92",questionText:"Zenith Lifesciences Ltd maintains a defined benefit gratuity plan for its employees. At the end of FY 2023-24, due to sudden increases in employee salary escalation rates, the actuarial valuation of the Defined Benefit Obligation resulted in an actuarial loss of ₹ 18,00,000. How should this actuarial loss be recognized under AS 15 (Revised)?",options:[{id:"a",text:"Amortized over the expected average remaining working lives of participating employees"},{id:"b",text:"Recognized immediately and in full in the Statement of Profit and Loss"},{id:"c",text:"Debited directly to Retained Earnings under Reserves & Surplus without hitting P&L"},{id:"d",text:"Deferred as a Miscellaneous Expenditure asset on the Balance Sheet"}],correctOptionId:"b",trapNote:"Under Ind AS 19, actuarial gains/losses go to Other Comprehensive Income (OCI), BUT under AS 15 (which applies to CA Inter under Indian AS), they MUST be recognized IMMEDIATELY IN THE STATEMENT OF PROFIT AND LOSS!",explanation:"As per AS 15 (Revised) Para 92, actuarial gains and losses should be recognized immediately in the Statement of Profit and Loss as income or expense in the period in which they occur. Deferral or amortization over working lives is strictly prohibited."},{id:"mcq_p1_adv_as28",subjectId:"p1_adv_acc",chapterId:"as_ppe_dep",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: AS 28 Impairment of Assets CGU Loss Allocation",marks:2,difficulty:"Examiner Favorite",icaiReference:"AS 28 Impairment of Assets - Para 87 & 88",questionText:`A Cash Generating Unit (CGU) has the following carrying amounts:
- Goodwill: ₹ 40 Lakhs
- Factory Building: ₹ 120 Lakhs
- Specialized Plant: ₹ 80 Lakhs
Total Carrying Amount = ₹ 240 Lakhs.
At year-end, the Recoverable Amount of the CGU is assessed at ₹ 150 Lakhs. What is the impairment loss allocated to Factory Building as per AS 28?`,options:[{id:"a",text:"₹ 45 Lakhs"},{id:"b",text:"₹ 30 Lakhs"},{id:"c",text:"₹ 37.5 Lakhs"},{id:"d",text:"₹ 50 Lakhs"}],correctOptionId:"b",trapNote:"Total impairment loss = 240 - 150 = ₹ 90 Lakhs. Students often allocate the full 90L pro-rata across all 3 assets. Under AS 28, the impairment loss is FIRST allocated to write off Goodwill completely (₹ 40L), and ONLY the balance (₹ 50L) is allocated pro-rata to other assets!",explanation:"Total Impairment Loss = ₹ 240L - ₹ 150L = ₹ 90 Lakhs. Step 1: Reduce Goodwill to NIL = ₹ 40 Lakhs allocated to Goodwill. Step 2: Remaining loss = ₹ 90L - ₹ 40L = ₹ 50 Lakhs allocated pro-rata between Building (120L) and Plant (80L) in the ratio of 120:80 (3:2). Loss to Building = ₹ 50L × (120 / 200) = ₹ 30 Lakhs."},{id:"mcq_p1_adv_sched3",subjectId:"p1_adv_acc",chapterId:"company_accounts_buyback",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Schedule III Operating Cycle Classification",marks:2,difficulty:"Examiner Favorite",icaiReference:"Schedule III to Companies Act, 2013 - General Instructions",questionText:"Mega Infrastructure Ltd has an operating cycle of 22 months for its commercial property development division. Trade receivables amounting to ₹ 14 Crores are expected to be realized in 18 months from the Balance Sheet date. How should these receivables be classified in the Balance Sheet under Schedule III?",options:[{id:"a",text:"Non-Current Asset, because settlement period exceeds 12 months"},{id:"b",text:"Current Asset, because realization falls within the entity’s normal operating cycle (22 months)"},{id:"c",text:"Contingent Asset disclosed only in Notes to Accounts"},{id:"d",text:"Split into Current (12 months portion) and Non-Current (6 months portion)"}],correctOptionId:"b",trapNote:"An asset is Current if it is expected to be realized in the entity’s NORMAL OPERATING CYCLE, even if that operating cycle exceeds 12 months!",explanation:"Under Schedule III Division I, an asset shall be classified as Current when it is expected to be realized in, or is intended for sale or consumption in, the company’s normal operating cycle. Since the operating cycle is 22 months, receivables realizable in 18 months are 100% Current Assets."},{id:"mcq_p2_adv_sec185",subjectId:"p2_law",chapterId:"audit_auditors",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Section 185 Loans to Directors & Controlled Entities",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 185 Companies Act, 2013",questionText:"Kalyan Synthetics Ltd (a public company) wishes to grant a corporate loan of ₹ 15 Crores to Vardhman Mills Pvt Ltd. Mr. Kalyan, a director of Kalyan Synthetics Ltd, holds 28% of the voting power in Vardhman Mills Pvt Ltd. Under Section 185, how can this loan be validly advanced?",options:[{id:"a",text:"The loan is strictly and totally prohibited under Section 185(1) under any circumstance"},{id:"b",text:"Permissible if approved by a Special Resolution in general meeting and the borrowing company uses the funds strictly for its principal business activities"},{id:"c",text:"Permissible with simple Board of Directors approval by ordinary majority"},{id:"d",text:"Permissible only if prior approval of the National Company Law Tribunal (NCLT) is obtained"}],correctOptionId:"b",trapNote:"Section 185(1) prohibits loans to director/partner/relative. But Section 185(2) permits loans to an entity where director holds >= 25% voting power IF approved by SPECIAL RESOLUTION and utilized by borrowing company for principal business activity!",explanation:"Under Section 185(2) of the Companies Act, 2013, a company may advance any loan to any person in whom any of the directors is interested (which includes a private company in which director holds >= 25% voting power) if a Special Resolution is passed in General Meeting and the loan is utilized by the borrower for its principal business activities."},{id:"mcq_p2_adv_sec188",subjectId:"p2_law",chapterId:"mgmt_admin",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Section 188 Related Party Transactions Arm’s Length",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 188(1) Proviso Companies Act, 2013",questionText:"Surya Steel Ltd enters into a contract for sale of specialized steel billets amounting to ₹ 80 Crores with an entity where its Managing Director holds 40% equity. The transaction is entered into in the ordinary course of business and is transacted at prevailing arm’s length market price. Which approval is required under Section 188?",options:[{id:"a",text:"Approval of Shareholders by Special Resolution is mandatory due to size exceeding ₹ 50 Crores"},{id:"b",text:"Approval of Central Government (MCA) is required"},{id:"c",text:"No Board approval or Shareholder approval is required under Section 188 because transactions in the ordinary course of business at arm’s length are exempt"},{id:"d",text:"Ordinary Resolution of disinterested shareholders is required"}],correctOptionId:"c",trapNote:"Under the 4th Proviso to Section 188(1), nothing in Section 188(1) shall apply to any transactions entered into by the company in its ordinary course of business other than transactions which are not on an arm’s length basis!",explanation:"As per the Fourth Proviso to Section 188(1) of the Companies Act, 2013, the requirement of Board approval and Shareholder resolution does NOT apply to any contract entered into by the company in its ordinary course of business, provided the transaction is on an arm’s length basis."},{id:"mcq_p2_adv_sec90",subjectId:"p2_law",chapterId:"mgmt_admin",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Section 90 Significant Beneficial Ownership (SBO)",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 90 Companies Act, 2013 & Companies (SBO) Rules",questionText:'Under Section 90 of the Companies Act, 2013 read with the SBO Rules, what is the minimum threshold of indirect or direct shareholding/voting rights that constitutes an individual as a "Significant Beneficial Owner" (SBO) in a reporting company?',options:[{id:"a",text:"Not less than 25%"},{id:"b",text:"Not less than 5%"},{id:"c",text:"Not less than 10%"},{id:"d",text:"Not less than 51%"}],correctOptionId:"c",trapNote:"In the original Companies Act 2013 text, 25% was referenced, but the Companies (Significant Beneficial Owners) Rules 2018 lowered and prescribed the definitive statutory threshold to strictly NOT LESS THAN 10%!",explanation:"Under Rule 2(1)(h) of the Companies (Significant Beneficial Owners) Rules, 2018, an individual is an SBO if he holds directly or indirectly not less than 10% of shares, not less than 10% of voting rights, or has the right to receive or participate in not less than 10% of the total distributable dividend."},{id:"mcq_p2_adv_gca",subjectId:"p2_law",chapterId:"general_clauses_interpretation",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: General Clauses Act 1897 Section 27 Service by Post",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 27 General Clauses Act, 1897",questionText:'A statutory show-cause notice was sent by the Registrar to a company by registered post with prepaid postage, properly addressed to its registered office. The envelope was returned with the remark "refused by recipient". As per Section 27 of the General Clauses Act, 1897, what is the legal presumption regarding service?',options:[{id:"a",text:"Service is deemed to be properly effected at the time at which the letter would be delivered in the ordinary course of post"},{id:"b",text:"Service is completely void and fresh notice must be served by hand delivery"},{id:"c",text:"Service is valid only if public advertisement in newspapers is simultaneously issued"},{id:"d",text:"The sender must file a police complaint before service is legally recognized"}],correctOptionId:"a",trapNote:"Under Section 27, if a document is properly addressed, prepaid, and posted by registered post, service is DEEMED to have been effected unless contrary is proved by addressee.",explanation:"Under Section 27 of the General Clauses Act, 1897, service is deemed to be effected by properly addressing, prepaying, and posting by registered post, and unless the contrary is proved, to have been effected at the time at which the letter would be delivered in the ordinary course of post."},{id:"mcq_p3_adv_marginal_relief",subjectId:"p3_tax",chapterId:"total_income_comp",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Section 115BAC Marginal Relief Computation",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 115BAC(1A) Proviso read with Section 87A",questionText:"Mr. Arvind (resident individual, age 32) has Total Taxable Income of ₹ 7,15,000 for AY 2024-25 under the default tax regime under Section 115BAC(1A). Compute his net tax liability before health & education cess, considering statutory Marginal Relief under Section 87A proviso.",options:[{id:"a",text:"₹ 26,500"},{id:"b",text:"₹ 15,000"},{id:"c",text:"₹ 11,500"},{id:"d",text:"NIL"}],correctOptionId:"b",trapNote:"Tax on 7,15,000 under slab rates = 15,000 (up to 6L) + 11,500 (10% on 1.15L) = ₹ 26,500. Income exceeding ₹ 7,00,000 is only ₹ 15,000! Under Marginal Relief, tax cannot exceed the amount by which income exceeds ₹ 7 Lakhs (i.e. max tax is ₹ 15,000)!",explanation:"Under the Proviso to Section 115BAC(1A), where Total Income exceeds ₹ 7,00,000 by a small amount, marginal relief ensures that the tax payable shall not exceed the income in excess of ₹ 7,00,000. Income above ₹ 7L = ₹ 7,15,000 - ₹ 7,00,000 = ₹ 15,000. Slab tax = ₹ 26,500. Marginal Relief = ₹ 26,500 - ₹ 15,000 = ₹ 11,500. Net tax before cess = ₹ 15,000."},{id:"mcq_p3_adv_sec194q",subjectId:"p3_tax",chapterId:"pgbp_deductions",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Section 194Q TDS vs Section 206C(1H) TCS Conflict",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 194Q(5) & Section 206C(1H) Second Proviso",questionText:"Company A (Buyer, turnover ₹ 25 Crores in preceding FY) purchases industrial polymers worth ₹ 85 Lakhs from Company B (Seller, turnover ₹ 18 Crores in preceding FY). Who is liable to deduct TDS or collect TCS under the Income-tax Act, 1961?",options:[{id:"a",text:"Company B must collect TCS @ 0.1% on ₹ 35 Lakhs under Section 206C(1H)"},{id:"b",text:"Company A must deduct TDS @ 0.1% on ₹ 35 Lakhs under Section 194Q, and Section 206C(1H) shall NOT apply"},{id:"c",text:"Both Company A must deduct TDS and Company B must collect TCS simultaneously"},{id:"d",text:"No tax is deductible or collectible because threshold is ₹ 1 Crore"}],correctOptionId:"b",trapNote:"Under Section 206C(1H) second proviso, if buyer is liable to deduct TDS under Section 194Q, TCS under Section 206C(1H) does NOT apply! Section 194Q has statutory primacy over 206C(1H)!",explanation:"Under Section 194Q, a buyer having turnover > ₹ 10 Cr must deduct TDS @ 0.1% on value exceeding ₹ 50 Lakhs (₹ 85L - ₹ 50L = ₹ 35 Lakhs). By virtue of Section 194Q(5) and the second proviso to Section 206C(1H), if a transaction is subject to TDS u/s 194Q, TCS u/s 206C(1H) shall not apply."},{id:"mcq_p3_adv_gst_tos",subjectId:"p3_tax",chapterId:"gst_supply_charge",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: GST Time of Supply Continuous Supply of Services",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 13(2) read with Section 31(5) of CGST Act, 2017",questionText:"M/s SecureTech provides annual security surveillance services under a contract where quarterly billing statements are issued on the last day of each quarter. For the quarter ending 30th September, the billing statement was issued on 30th September. Tax invoice was issued on 22nd October. Payment was credited to bank account on 15th October. What is the Time of Supply under GST?",options:[{id:"a",text:"22nd October (Date of Invoice)"},{id:"b",text:"30th September (Date of Statement / Due Date of Payment)"},{id:"c",text:"15th October (Date of Payment Credit)"},{id:"d",text:"20th November (Due date of GSTR-3B)"}],correctOptionId:"b",trapNote:"Under Section 31(5), in continuous supply of services, invoice MUST be issued on or before the date of statement (30th Sept). Since invoice was delayed to 22nd Oct, time of supply falls back to date of provision / due date under Section 13(2)(b), which is 30th September!",explanation:"Under Section 31(5)(a), where the due date of payment or statement is ascertainable from contract, invoice must be issued on or before that date (30th Sept). Since invoice was issued after the due date, Time of Supply as per Section 13(2)(b) is the earlier of date of provision (30th Sept) or date of payment (15th Oct), which is 30th September."},{id:"mcq_p4_adv_idle_time",subjectId:"p4_costing",chapterId:"standard_costing",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Standard Costing Idle Time Variance Treatment",marks:2,difficulty:"Examiner Favorite",icaiReference:"Standard Costing Principles - Labour Variances",questionText:"In a manufacturing plant, standard hourly wage is ₹ 60. During the week, 50 workers worked 42 hours each and were paid @ ₹ 65 per hour. Due to a major power breakdown, 150 worker-hours were lost as idle time. What is the Idle Time Variance, and how is it always characterized?",options:[{id:"a",text:"₹ 9,000 Adverse (Idle time variance is ALWAYS Adverse)"},{id:"b",text:"₹ 9,750 Adverse"},{id:"c",text:"₹ 9,000 Favourable if production targets were met"},{id:"d",text:"NIL, because power breakdown is an uncontrollable external event"}],correctOptionId:"a",trapNote:"Idle Time Variance = Idle Hours × STANDARD RATE (not actual rate!). 150 hrs × ₹ 60 = ₹ 9,000 Adverse. Idle time variance can NEVER be Favourable!",explanation:"Idle Time Variance is calculated as: Idle Hours × Standard Rate = 150 hours × ₹ 60 = ₹ 9,000 (Adverse). Because standard cost systems do not budget for abnormal idle time, idle time variance is by definition ALWAYS ADVERSE."},{id:"mcq_p4_adv_limiting_factor",subjectId:"p4_costing",chapterId:"marginal_costing",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Marginal Costing Limiting Factor Optimum Mix",marks:2,difficulty:"Examiner Favorite",icaiReference:"Marginal Costing Decision Rule for Key Factor",questionText:`A company manufactures two products: Product X and Product Y. Machine hours are the limiting factor (bottleneck constraint).
- Product X: Selling price ₹ 150, Variable cost ₹ 90, Machine hours required per unit = 2 hours.
- Product Y: Selling price ₹ 220, Variable cost ₹ 140, Machine hours required per unit = 4 hours.
To maximize profitability under constrained capacity, which product should be given highest production priority?`,options:[{id:"a",text:"Product Y, because it generates higher unit contribution of ₹ 80"},{id:"b",text:"Product X, because it generates higher contribution per machine hour of ₹ 30"},{id:"c",text:"Both should be produced equally in a 50:50 ratio"},{id:"d",text:"Product Y, because its selling price is higher"}],correctOptionId:"b",trapNote:"Students mistakenly rank by unit contribution (Y has ₹ 80 vs X has ₹ 60). Under a limiting factor, ranking must strictly be done by Contribution PER UNIT OF LIMITING FACTOR!",explanation:"Contribution per unit: Product X = ₹ 150 - ₹ 90 = ₹ 60; Product Y = ₹ 220 - ₹ 140 = ₹ 80. Contribution per machine hour: Product X = ₹ 60 / 2 hrs = ₹ 30 per hour; Product Y = ₹ 80 / 4 hrs = ₹ 20 per hour. Since Product X yields ₹ 30/hr vs ₹ 20/hr for Y, Product X must be given highest production priority."},{id:"mcq_p5_adv_sa705_disclaimer",subjectId:"p5_audit",chapterId:"audit_report",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: SA 705 Disclaimer of Opinion Scope Limitation",marks:2,difficulty:"Examiner Favorite",icaiReference:"SA 705 (Revised) Modifications to the Opinion - Para 9 & 10",questionText:"An auditor is unable to obtain sufficient appropriate audit evidence regarding opening balances and 45% of current year trade receivables and inventory due to a complete destruction of accounting servers by ransomware without backups. The potential effects are both material and pervasive. What opinion must the auditor express under SA 705?",options:[{id:"a",text:"Adverse Opinion"},{id:"b",text:"Qualified Opinion"},{id:"c",text:"Disclaimer of Opinion"},{id:"d",text:"Unmodified Opinion with Key Audit Matter paragraph"}],correctOptionId:"c",trapNote:"An Adverse Opinion is expressed when the auditor HAS obtained evidence of misstatement that is material and pervasive. When the auditor is UNABLE TO OBTAIN evidence (scope limitation) and effects are material and pervasive, it is strictly a DISCLAIMER OF OPINION!",explanation:"Under SA 705 Para 9, the auditor shall disclaim an opinion when the auditor is unable to obtain sufficient appropriate audit evidence on which to base the opinion, and the auditor concludes that the possible effects on the financial statements of undetected misstatements, if any, could be both material and pervasive."},{id:"mcq_p5_adv_sec143_12",subjectId:"p5_audit",chapterId:"fraud_responsibilities",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Section 143(12) Fraud Reporting to Central Government",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 143(12) read with Rule 13 of Companies (Audit and Auditors) Rules, 2014",questionText:"During the audit of a listed company, the statutory auditor discovers an offense involving fraud committed by an officer amounting to ₹ 1.8 Crores. As per Section 143(12) and Rule 13, within what timeline must the auditor report this fraud to the Central Government (MCA) in Form ADT-4?",options:[{id:"a",text:"Directly report to Central Government within 2 days of discovery without asking management"},{id:"b",text:"Forward report to Board/Audit Committee within 2 days for reply within 45 days, and on receipt of reply (or failure to reply), forward report to Central Government within 15 days in Form ADT-4"},{id:"c",text:"Report to Central Government only if Board fails to file a police FIR within 90 days"},{id:"d",text:"Disclose only in the Auditor’s Report under CARO 2020 at the AGM"}],correctOptionId:"b",trapNote:"Auditor must first report to Board/Audit Committee within 2 days asking for reply within 45 days, and thereafter report to Central Government within 15 days in Form ADT-4.",explanation:"Under Section 143(12) read with Rule 13, for fraud >= ₹ 1 Crore, the auditor shall report the matter to Board/Audit Committee within 2 days seeking reply within 45 days. On receipt of reply or expiry of 45 days, the auditor shall forward the report along with reply to the Central Government within 15 days in Form ADT-4."},{id:"mcq_p6_adv_wacc_capm",subjectId:"p6_fm_sm",chapterId:"fm_cost_of_capital",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: Cost of Equity CAPM with Market Risk Premium",marks:2,difficulty:"Examiner Favorite",icaiReference:"Cost of Capital Estimation - Capital Asset Pricing Model",questionText:"A company's equity beta is 1.4. The risk-free rate of return (Government Treasury bond yield) is 7%. The expected market return (Rm) is 15%. What is the cost of equity (Ke) using the Capital Asset Pricing Model (CAPM)?",options:[{id:"a",text:"18.2%"},{id:"b",text:"21.0%"},{id:"c",text:"14.5%"},{id:"d",text:"16.8%"}],correctOptionId:"a",trapNote:"CAPM formula: Ke = Rf + Beta × (Rm - Rf). Students often forget to subtract Rf from Rm and multiply Beta by Rm directly. Market Risk Premium = 15% - 7% = 8%. Ke = 7% + 1.4 × 8% = 18.2%.",explanation:"Ke = Rf + β(Rm - Rf) = 7% + 1.4 × (15% - 7%) = 7% + 1.4 × 8% = 7% + 11.2% = 18.2%."},{id:"mcq_p6_adv_bcg_matrix",subjectId:"p6_fm_sm",chapterId:"sm_strategic_mgmt",type:"mcq",importance:"HIGH",source:"ICAI Exam Style: BCG Growth-Share Matrix Strategic Quadrants",marks:2,difficulty:"Examiner Favorite",icaiReference:"BCG Growth-Share Matrix Framework",questionText:"Under the Boston Consulting Group (BCG) Growth-Share Matrix, a Strategic Business Unit (SBU) that operates in a high-growth market but currently possesses a low relative market share is categorized as:",options:[{id:"a",text:"Cash Cow"},{id:"b",text:"Question Mark (Problem Child)"},{id:"c",text:"Star"},{id:"d",text:"Dog"}],correctOptionId:"b",trapNote:"High Growth + Low Market Share = Question Mark. High Growth + High Market Share = Star. Low Growth + High Market Share = Cash Cow. Low Growth + Low Market Share = Dog.",explanation:"In the BCG matrix, SBUs in high-growth markets with low market share are called Question Marks or Problem Children. They require substantial cash infusion to maintain market share and have the potential to become Stars if nurtured, or Dogs if neglected."}],ua=[{id:"desc_p2_csr_01",subjectId:"p2_law",chapterId:"accounts_csr",type:"descriptive",importance:"HIGH",source:"ICAI May 2024 Exam (Q2b - 6 Marks)",sourceYear:"May 2024",marks:6,difficulty:"Examiner Favorite",icaiReference:"Section 135 of Companies Act, 2013 & Companies (CSR Policy) Rules, 2014",questionText:`AB Technologies Ltd. has reported the following financial parameters as on 31st March 2023:
- Net Worth: ₹ 420 Crores
- Turnover: ₹ 950 Crores
- Net Profit: ₹ 6.2 Crores (calculated under Section 198)

The net profits for the preceding three financial years were:
- FY 2020-21: ₹ 4.5 Crores
- FY 2021-22: ₹ 5.5 Crores
- FY 2022-23: ₹ 6.5 Crores

Required:
(i) Examine whether the company is required to constitute a Corporate Social Responsibility (CSR) Committee for FY 2023-24 under Section 135(1).
(ii) Calculate the minimum amount the company is required to spend on CSR activities for FY 2023-24.
(iii) State what happens if the company fails to spend the required amount on an ongoing project.`,rubrics:[{step:"Applicability Analysis under Section 135(1)",marks:2,expectedKeywords:["Section 135(1)","Net worth >= 500 Crores","Turnover >= 1000 Crores","Net profit >= 5 Crores","preceding financial year"],mandatoryCitations:["Section 135(1)","Section 135"],description:"Mention the 3 threshold criteria and evaluate that Net Profit of ₹ 6.2 Cr exceeds ₹ 5 Cr threshold, hence CSR is applicable."},{step:"Calculation of Minimum CSR Expenditure",marks:2,expectedKeywords:["2%","average net profits","three immediately preceding financial years","5.5 Crores","11 Lakhs","0.11 Crores"],description:"Calculate average net profit = (4.5 + 5.5 + 6.5) / 3 = ₹ 5.50 Crores. 2% of ₹ 5.50 Cr = ₹ 11 Lakhs."},{step:"Treatment of Unspent CSR for Ongoing Project",marks:2,expectedKeywords:["Section 135(6)","30 days","Unspent Corporate Social Responsibility Account","three financial years","Fund specified in Schedule VII"],mandatoryCitations:["Section 135(6)"],description:"State transfer to special bank account within 30 days from end of FY, and spend within 3 FYs, failing which transfer to Schedule VII fund within 30 days."}],suggestedAnswer:`(i) Applicability of CSR Committee [Section 135(1)]:
As per Section 135(1) of the Companies Act, 2013, every company having:
- Net worth of ₹ 500 Crore or more, OR
- Turnover of ₹ 1000 Crore or more, OR
- Net profit of ₹ 5 Crore or more
during the immediately preceding financial year shall constitute a Corporate Social Responsibility (CSR) Committee of the Board.
In the given case of AB Technologies Ltd.:
- Net Worth is ₹ 420 Crores (< ₹ 500 Cr)
- Turnover is ₹ 950 Crores (< ₹ 1000 Cr)
- Net Profit for FY 2022-23 is ₹ 6.2 Crores, which exceeds the statutory threshold of ₹ 5 Crores.
Conclusion: AB Technologies Ltd. is mandatorily required to constitute a CSR Committee for FY 2023-24.

(ii) Computation of Minimum CSR Expenditure [Section 135(5)]:
As per Section 135(5), the Board shall ensure that the company spends, in every financial year, at least 2% of the average net profits of the company made during the three immediately preceding financial years.
1. Net Profits of preceding 3 years:
   FY 2020-21: ₹ 4.50 Crores
   FY 2021-22: ₹ 5.50 Crores
   FY 2022-23: ₹ 6.50 Crores
   Total Net Profit = ₹ 16.50 Crores
2. Average Net Profit = ₹ 16.50 Crores / 3 = ₹ 5.50 Crores
3. Minimum CSR Spend = 2% of ₹ 5.50 Crores = ₹ 0.11 Crores (or ₹ 11 Lakhs).

(iii) Treatment of Unspent Amount for Ongoing Project [Section 135(6)]:
If the company fails to spend the allocated amount pursuant to an ongoing project:
1. The unspent amount (₹ 11 Lakhs or remaining portion) must be transferred to a special account opened in a scheduled bank called "Unspent Corporate Social Responsibility Account" within 30 days from the end of the financial year (i.e. by 30th April).
2. The amount must be spent on the ongoing project within 3 financial years from the date of transfer.
3. If not spent within 3 financial years, the remaining balance must be transferred to a Fund specified in Schedule VII within 30 days of the end of the third financial year.`},{id:"desc_p4_variance_01",subjectId:"p4_costing",chapterId:"standard_costing",type:"descriptive",importance:"HIGH",source:"ICAI Nov 2023 Exam (Q3a - 10 Marks)",sourceYear:"Nov 2023",marks:10,difficulty:"Examiner Favorite",icaiReference:"Standard Costing - Material & Labour Variances",questionText:`Delta Chemical Ltd. manufactures a single product "Chem-X". The standard cost details per unit of output are as follows:
- Material A: 4 kg @ ₹ 50 per kg = ₹ 200
- Material B: 6 kg @ ₹ 30 per kg = ₹ 180
Standard Input = 10 kg; Standard Loss = 10%; Standard Output = 9 kg.

During the month of October 2023, the actual production was 1,800 kg of Chem-X.
Actual consumption of materials was:
- Material A: 900 kg @ ₹ 52 per kg = ₹ 46,800
- Material B: 1,300 kg @ ₹ 28 per kg = ₹ 36,400

Required:
Calculate:
(i) Material Cost Variance (MCV)
(ii) Material Price Variance (MPV)
(iii) Material Usage Variance (MUV)
(iv) Material Mix Variance (MMV)
(v) Material Yield Variance (MYV)
Also verify the mathematical reconciliation between the variances.`,rubrics:[{step:"Standard Quantity (SQ) calculation for actual output",marks:2,expectedKeywords:["SQ for actual output","1800 kg","Material A: 800 kg","Material B: 1200 kg"],description:"For 9 kg output, Material A = 4 kg, B = 6 kg. For 1,800 kg output: SQ(A) = (1800/9)*4 = 800 kg; SQ(B) = (1800/9)*6 = 1200 kg."},{step:"Calculation of Material Cost, Price & Usage Variances",marks:4,expectedKeywords:["MCV = ₹ 6,800 A","MPV(A) = ₹ 1,800 A","MPV(B) = ₹ 2,600 F","Net MPV = ₹ 800 F","MUV(A) = ₹ 5,000 A","MUV(B) = ₹ 3,000 A","Net MUV = ₹ 7,600 A","Adverse","Favourable"],description:"Standard formula applications: MPV = AQ*(SP - AP); MUV = SP*(SQ - AQ); MCV = SC - AC."},{step:"Calculation of Mix and Yield Variances & Reconciliation",marks:4,expectedKeywords:["Total Actual Quantity = 2200 kg","Revised Standard Quantity (RSQ)","RSQ(A) = 880 kg","RSQ(B) = 1320 kg","MMV = ₹ 400 A","MYV = ₹ 7,200 A","Reconciliation"],description:"Calculate RSQ based on standard ratio 4:6. MMV = SP*(RSQ - AQ). MYV = SP*(SQ - RSQ). Verify MCV = MPV + MUV."}],suggestedAnswer:`WORKING NOTES:
1. Standard Input for Actual Output of 1,800 kg:
   Standard Output from 10 kg input = 9 kg.
   Total Standard Input required = 1,800 × (10 / 9) = 2,000 kg.
   Standard Quantity for Actual Output:
   - Material A: 2,000 × (4 / 10) = 800 kg
   - Material B: 2,000 × (6 / 10) = 1,200 kg

2. Actual Input = 900 kg (A) + 1,300 kg (B) = 2,200 kg.
3. Revised Standard Quantity (RSQ) [Actual input in standard proportion 4 : 6]:
   - Material A: 2,200 × (4 / 10) = 880 kg
   - Material B: 2,200 × (6 / 10) = 1,320 kg

CALCULATION OF VARIANCES:

1. Material Price Variance (MPV) = Actual Quantity × (Standard Price - Actual Price)
   - Material A = 900 × (₹ 50 - ₹ 52) = ₹ 1,800 (Adverse)
   - Material B = 1,300 × (₹ 30 - ₹ 28) = ₹ 2,600 (Favourable)
   Total MPV = ₹ 800 (Favourable)

2. Material Usage Variance (MUV) = Standard Price × (Standard Quantity - Actual Quantity)
   - Material A = ₹ 50 × (800 - 900) = ₹ 5,000 (Adverse)
   - Material B = ₹ 30 × (1,200 - 1,300) = ₹ 3,000 (Adverse)
   Total MUV = ₹ 8,000 (Adverse) [Note: 800*50 + 1200*30 = 76000 vs 900*50 + 1300*30 = 84000 => ₹ 8,000 (A)]

3. Material Cost Variance (MCV) = Standard Cost - Actual Cost
   Standard Cost = (800 × ₹ 50) + (1,200 × ₹ 30) = ₹ 40,000 + ₹ 36,000 = ₹ 76,000
   Actual Cost = ₹ 46,800 + ₹ 36,400 = ₹ 83,200
   Total MCV = ₹ 76,000 - ₹ 83,200 = ₹ 7,200 (Adverse)

4. Material Mix Variance (MMV) = Standard Price × (Revised Standard Quantity - Actual Quantity)
   - Material A = ₹ 50 × (880 - 900) = ₹ 1,000 (Adverse)
   - Material B = ₹ 30 × (1,320 - 1,300) = ₹ 600 (Favourable)
   Total MMV = ₹ 400 (Adverse)

5. Material Yield Variance (MYV) = Standard Price × (Standard Quantity - Revised Standard Quantity)
   - Material A = ₹ 50 × (800 - 880) = ₹ 4,000 (Adverse)
   - Material B = ₹ 30 × (1,200 - 1,320) = ₹ 3,600 (Adverse)
   Total MYV = ₹ 7,600 (Adverse)

RECONCILIATION:
- MCV = MPV + MUV => ₹ 7,200 (A) = ₹ 800 (F) + ₹ 8,000 (A) [Verified]
- MUV = MMV + MYV => ₹ 8,000 (A) = ₹ 400 (A) + ₹ 7,600 (A) [Verified]`},{id:"desc_p5_sa705_01",subjectId:"p5_audit",chapterId:"audit_report",type:"descriptive",importance:"HIGH",source:"ICAI May 2024 Exam (Q4a - 5 Marks)",sourceYear:"May 2024",marks:5,difficulty:"Examiner Favorite",icaiReference:"SA 705 (Revised) Modifications to the Opinion in the Independent Auditor’s Report",questionText:`CA. Ananya is the statutory auditor of Zenith Retail Ltd. During the audit for the financial year ended 31st March 2024, she observed that the company has not provided for bad and doubtful debts amounting to ₹ 45 Lakhs on receivables, despite substantial legal disputes with those debtors. The profit before tax of the company is ₹ 38 Lakhs. The management refuses to create any provision or adjust the financial statements.

Explain the type of audit opinion CA. Ananya should issue as per SA 705 (Revised), detailing the conditions under which such opinion is warranted, and the wording of the Opinion section.`,rubrics:[{step:"Evaluation of Materiality and Pervasiveness",marks:2,expectedKeywords:["SA 705","Material","Pervasive","profit turns into loss","fundamental to users"],mandatoryCitations:["SA 705"],description:"Mention that unprovided bad debts of ₹ 45 Lakhs exceeds PBT of ₹ 38 Lakhs, turning profit into loss, thus material and pervasive."},{step:"Choice of Audit Opinion (Adverse Opinion)",marks:2,expectedKeywords:["Adverse Opinion","sufficient appropriate audit evidence","financial statements do not give a true and fair view"],description:"Conclude that an Adverse Opinion is required because evidence is obtained and misstatement is both material and pervasive."},{step:"Basis for Adverse Opinion & Heading",marks:1,expectedKeywords:["Basis for Adverse Opinion","substantive explanation","quantification of effect"],description:'State requirement to include "Basis for Adverse Opinion" section immediately following Adverse Opinion section.'}],suggestedAnswer:`1. Provision of SA 705 (Revised):
As per SA 705 (Revised) "Modifications to the Opinion in the Independent Auditor's Report":
- An auditor shall express an Adverse Opinion when the auditor, having obtained sufficient appropriate audit evidence, concludes that misstatements, individually or in the aggregate, are BOTH material and pervasive to the financial statements.
- A misstatement is pervasive when it is not confined to specific elements, represents a substantial proportion of the financial statements, or is fundamental to users' understanding.

2. Application to Facts of Zenith Retail Ltd:
- Profit Before Tax reported by the company = ₹ 38 Lakhs.
- Unprovided doubtful debts = ₹ 45 Lakhs.
- If the required provision is made, the reported profit of ₹ 38 Lakhs will convert into a Net Loss of ₹ 7 Lakhs.
- This misstatement alters the fundamental financial position from profitability to loss and substantially impacts the Balance Sheet (Current Assets / Debtors) and Statement of Profit and Loss.
- Therefore, the misstatement is both MATERIAL and PERVASIVE to the financial statements.

3. Opinion to be Issued:
CA. Ananya must issue an ADVERSE OPINION.

4. Reporting Requirements:
- Use heading: "Adverse Opinion".
- State that because of the significance of the matter described in the "Basis for Adverse Opinion" section, the accompanying financial statements do not give a true and fair view in conformity with the accounting principles generally accepted in India.
- Include a "Basis for Adverse Opinion" section immediately following the Opinion section, clearly quantifying the effect on trade receivables, profit before tax, and reserves.`},{id:"desc_p1_as16_01",subjectId:"p1_adv_acc",chapterId:"as_ppe_dep",type:"descriptive",importance:"HIGH",source:"RTP Nov 2024 (5 Marks)",sourceYear:"Nov 2024",marks:5,difficulty:"Examiner Favorite",icaiReference:"AS 16 Borrowing Costs - Para 3, 6 & 10",questionText:`Aura Infrastructures Ltd. borrowed ₹ 60,00,000 from ICICI Bank on 1st April 2023 at 11% p.a. to finance the construction of a customized toll bridge (a qualifying asset). The construction commenced on 1st May 2023. During the year:
- Funds temporarily pending deployment were placed in short-term bank fixed deposits and earned interest income of ₹ 72,000.
- Normal technical interruptions occurred for 12 days due to monsoon curing of concrete.
- In addition to specific borrowing, company had general borrowings of ₹ 1,00,00,000 at 12% p.a. Out of general funds, ₹ 15,00,000 was utilized for the bridge on 1st October 2023.
The bridge was ready for intended use on 31st March 2024.

Calculate:
(i) Borrowing cost to be capitalized from Specific Borrowing.
(ii) Borrowing cost to be capitalized from General Borrowing.
(iii) Total cost capitalized to the Qualifying Asset.`,rubrics:[{step:"Specific Borrowing Cost Capitalization under AS 16",marks:2,expectedKeywords:["Commencement from 1st May 2023","11 months","Interest: ₹ 60,00,000 * 11% * 11/12","₹ 6,05,000","Less interest income ₹ 72,000","Net: ₹ 5,33,000"],mandatoryCitations:["AS 16"],description:"Capitalization commences only when activities necessary to prepare asset are in progress (from 1st May, 11 months). Deduct temporary interest income."},{step:"General Borrowing Cost Capitalization",marks:2,expectedKeywords:["Capitalization rate 12%","6 months","15,00,000 * 12% * 6/12","₹ 90,000"],description:"General funds deployed for 6 months (Oct to March) @ 12% = ₹ 90,000."},{step:"Total Capitalized Amount & Normal Interruption Note",marks:1,expectedKeywords:["Total: ₹ 6,23,000","Normal technical delay not suspended"],description:"State that normal interruptions necessary for construction (concrete curing) do not require suspension. Total = ₹ 5,33,000 + ₹ 90,000 = ₹ 6,23,000."}],suggestedAnswer:`1. Provisions of AS 16 "Borrowing Costs":
- Capitalization commences when: (a) expenditure on asset is being incurred, (b) borrowing costs are being incurred, and (c) activities necessary to prepare the asset are in progress.
- Specific Borrowings: Capitalize actual borrowing costs incurred during the period less any investment income on temporary investment of those borrowings.
- General Borrowings: Capitalize by applying capitalization rate to expenditure incurred from general borrowings.
- Suspension: Capitalization is suspended during extended abnormal interruptions; normal technical delays (like concrete curing) do not require suspension.

2. Specific Borrowing Capitalization:
- Construction commenced on 1st May 2023, hence capitalization is for 11 months (1st May 2023 to 31st March 2024).
- Interest incurred = ₹ 60,00,000 × 11% × (11/12) = ₹ 5,50,000
- Less: Temporary investment income earned = ₹ 72,000
- Net Specific Borrowing Cost Capitalized = ₹ 5,50,000 - ₹ 72,000 = ₹ 4,78,000
(Note: Interest for April ₹ 55,000 is charged to P&L as activities had not commenced).

3. General Borrowing Capitalization:
- General expenditure incurred on 1st October 2023 = ₹ 15,00,000
- Period deployed = 6 months (1st Oct 2023 to 31st March 2024)
- Capitalization Rate = 12%
- General Borrowing Cost Capitalized = ₹ 15,00,000 × 12% × (6/12) = ₹ 90,000

4. Total Borrowing Cost Capitalized:
- Specific Borrowing Cost = ₹ 4,78,000
- General Borrowing Cost = ₹ 90,000
- Total Borrowing Cost Added to Qualifying Asset = ₹ 5,68,000.`},{id:"desc_p3_capgains_01",subjectId:"p3_tax",chapterId:"capital_gains",type:"descriptive",importance:"HIGH",source:"ICAI May 2023 Exam (Q2a - 7 Marks)",sourceYear:"May 2023",marks:7,difficulty:"Examiner Favorite",icaiReference:"Section 45, Section 48, Section 50C & Section 54",questionText:`Mr. Rajesh (an individual, aged 45 years) sold a residential house property in Delhi on 15th December 2023 for an agreed consideration of ₹ 85,00,000. The Stamp Duty Value (SDV) on the date of registration was ₹ 98,00,000. He had purchased this house on 10th June 2011 for ₹ 25,00,000. Brokerage paid on sale was 1% of the agreed consideration.

On 20th March 2024, Mr. Rajesh purchased a new residential apartment in Noida for ₹ 40,00,000 and deposited ₹ 15,00,000 in the Capital Gains Account Scheme (CGAS) before the due date of filing return under Section 139(1).
(CII for FY 2011-12 = 184; FY 2023-24 = 348)

Required:
Compute the Taxable Capital Gains for Assessment Year 2024-25 assuming Mr. Rajesh opts for the old tax regime to claim Section 54 exemption.`,rubrics:[{step:"Application of Section 50C on Full Value of Consideration",marks:2,expectedKeywords:["Section 50C","Stamp Duty Value","110% of consideration","98,00,000","85,00,000 * 110% = 93,50,000"],mandatoryCitations:["Section 50C"],description:"Verify SDV (98L) > 110% of agreed consideration (93.5L), so full value of consideration is deemed to be ₹ 98,00,000."},{step:"Computation of Indexed Cost of Acquisition & Transfer Expenses",marks:2,expectedKeywords:["Brokerage: 1% of 85,00,000 = 85,000","Net consideration","Indexed Cost: 25,00,000 * 348 / 184 = ₹ 47,28,261"],description:"Deduct brokerage ₹ 85,000 and indexed cost of acquisition ₹ 47,28,261 from full value."},{step:"Exemption under Section 54 and Net LTCG",marks:3,expectedKeywords:["Section 54","Purchase of new house: ₹ 40,00,000","Deposit in CGAS: ₹ 15,00,000","Total Exemption: ₹ 55,00,000","Taxable LTCG"],mandatoryCitations:["Section 54"],description:"Compute LTCG before exemption. Exemption under Sec 54 = ₹ 40L + ₹ 15L = ₹ 55,00,000. Balance is taxable LTCG."}],suggestedAnswer:`COMPUTATION OF TAXABLE CAPITAL GAINS OF MR. RAJESH FOR AY 2024-25

1. Full Value of Consideration [Section 50C]:
   - Actual Consideration = ₹ 85,00,000
   - Stamp Duty Value (SDV) = ₹ 98,00,000
   - 110% of Actual Consideration = ₹ 85,00,000 × 110% = ₹ 93,50,000
   Since the Stamp Duty Value (₹ 98 Lakhs) exceeds 110% of the declared consideration (₹ 93.5 Lakhs), the Stamp Duty Value of ₹ 98,00,000 shall be taken as the Full Value of Consideration.
   Full Value of Consideration = ₹ 98,00,000

2. Less: Expenses on Transfer [Section 48(i)]:
   - Brokerage paid (1% of ₹ 85,00,000) = ₹ 85,000
   Net Sale Consideration = ₹ 97,15,000

3. Less: Indexed Cost of Acquisition [Section 48(ii)]:
   - Cost of Acquisition = ₹ 25,00,000 (purchased in FY 2011-12)
   - Indexed Cost = ₹ 25,00,000 × (348 / 184) = ₹ 47,28,261
   Gross Long Term Capital Gains (LTCG) = ₹ 97,15,000 - ₹ 47,28,261 = ₹ 49,86,739

4. Less: Exemption under Section 54:
   - Investment in new residential apartment in Noida = ₹ 40,00,000
   - Deposit in Capital Gain Account Scheme (CGAS) before due date = ₹ 15,00,000
   - Total eligible investment = ₹ 55,00,000
   Note: Exemption under Section 54 is restricted to the amount of Capital Gains generated (₹ 49,86,739).
   Exemption under Section 54 allowed = ₹ 49,86,739

5. Taxable Long Term Capital Gains:
   Taxable LTCG = Gross LTCG ₹ 49,86,739 - Exemption ₹ 49,86,739 = NIL.`},{id:"desc_p6_capbudg_01",subjectId:"p6_fm_sm",chapterId:"fm_cap_budgeting",type:"descriptive",importance:"HIGH",source:"ICAI Nov 2022 Exam (Q1 - 10 Marks)",sourceYear:"Nov 2022",marks:10,difficulty:"Examiner Favorite",icaiReference:"Capital Budgeting - NPV & Profitability Index",questionText:`Apex Engineering Ltd. is considering the acquisition of a CNC Machine. The machine costs ₹ 25,00,000 with installation charges of ₹ 1,00,000. Working capital required at the beginning is ₹ 4,00,000, which will be released at the end of Year 5. The useful life of the machine is 5 years with a salvage value of ₹ 2,00,000.

The expected Annual Earnings Before Depreciation and Tax (EBDT) are:
- Year 1: ₹ 8,00,000
- Year 2: ₹ 9,50,000
- Year 3: ₹ 11,00,000
- Year 4: ₹ 10,00,000
- Year 5: ₹ 8,50,000

The company provides straight-line depreciation. The corporate income tax rate is 25%. The cost of capital is 12%.
Discount factors @ 12%:
Year 1: 0.893 | Year 2: 0.797 | Year 3: 0.712 | Year 4: 0.636 | Year 5: 0.567

Required:
(i) Compute the Initial Cash Outflow.
(ii) Compute the Annual Cash Flow After Tax (CFAT) for Years 1 to 5.
(iii) Compute the Net Present Value (NPV) and Profitability Index (PI).
(iv) Advise the management whether the project should be accepted.`,rubrics:[{step:"Initial Cash Outflow Calculation",marks:2,expectedKeywords:["Initial Outflow","Cost 25,00,000","Installation 1,00,000","Working Capital 4,00,000","Total: ₹ 30,00,000"],description:"Total Initial Outlay = Machine (25L) + Installation (1L) + Initial Working Capital (4L) = ₹ 30,00,000."},{step:"Calculation of Annual Depreciation & CFAT",marks:4,expectedKeywords:["Depreciation = (26,00,000 - 2,00,000)/5 = ₹ 4,80,000","Tax 25%","CFAT = (EBDT - Dep)*(1 - t) + Dep","Terminal cash flow in Year 5: Salvage 2L + WC Release 4L = 6L"],description:"Calculate straight line depreciation = ₹ 4,80,000 p.a. Compute annual CFAT for each year."},{step:"NPV, PI and Recommendation",marks:4,expectedKeywords:["Present Value of Inflows","NPV > 0","Profitability Index > 1","Accept the project"],description:"Discount CFAT at 12%. Calculate NPV = PV of Inflows - Initial Outflow. Calculate PI. Recommend acceptance."}],suggestedAnswer:`WORKING NOTES:
1. Initial Cash Outflow (at t = 0):
   Cost of CNC Machine = ₹ 25,00,000
   Installation Charges = ₹ 1,00,00,00
   Total Capitalized Asset Cost = ₹ 26,00,000
   Working Capital Required = ₹ 4,00,000
   Total Initial Outlay (t=0) = ₹ 30,00,000

2. Annual Depreciation (SLM):
   Asset Cost = ₹ 26,00,000
   Less: Salvage Value = ₹ 2,00,000
   Depreciable Amount = ₹ 24,00,000
   Useful Life = 5 Years
   Annual Depreciation = ₹ 24,00,000 / 5 = ₹ 4,80,000 p.a.

3. Annual Operating Cash Flow After Tax (CFAT):
   CFAT = (EBDT - Depreciation) × (1 - Tax Rate) + Depreciation

   - Year 1: (₹ 8,00,000 - 4,80,000) × 0.75 + 4,80,000 = ₹ 2,40,000 + 4,80,000 = ₹ 7,20,000
   - Year 2: (₹ 9,50,000 - 4,80,000) × 0.75 + 4,80,000 = ₹ 3,52,500 + 4,80,000 = ₹ 8,32,500
   - Year 3: (₹ 11,00,000 - 4,80,000) × 0.75 + 4,80,000 = ₹ 4,65,000 + 4,80,000 = ₹ 9,45,000
   - Year 4: (₹ 10,00,000 - 4,80,000) × 0.75 + 4,80,000 = ₹ 3,90,000 + 4,80,000 = ₹ 8,70,000
   - Year 5 Operating CFAT: (₹ 8,50,000 - 4,80,000) × 0.75 + 4,80,000 = ₹ 7,57,500

4. Terminal Year Cash Flow (at t = 5):
   Operating CFAT = ₹ 7,57,500
   Add: Salvage Value realized = ₹ 2,00,000
   Add: Recovery of Working Capital = ₹ 4,00,000
   Total Year 5 Cash Inflow = ₹ 13,57,500

5. PRESENT VALUE CALCULATION (@ 12%):
   - Year 1: ₹ 7,20,000 × 0.893 = ₹ 6,42,960
   - Year 2: ₹ 8,32,500 × 0.797 = ₹ 6,63,503
   - Year 3: ₹ 9,45,000 × 0.712 = ₹ 6,72,840
   - Year 4: ₹ 8,70,000 × 0.636 = ₹ 5,53,320
   - Year 5: ₹ 13,57,500 × 0.567 = ₹ 7,69,703
   Total Present Value of Cash Inflows = ₹ 33,02,326

6. NET PRESENT VALUE (NPV):
   NPV = Total PV of Inflows - Initial Outflow
   NPV = ₹ 33,02,326 - ₹ 30,00,000 = + ₹ 3,02,326

7. PROFITABILITY INDEX (PI):
   PI = PV of Inflows / Initial Outflow = ₹ 33,02,326 / ₹ 30,00,000 = 1.10

CONCLUSION & RECOMMENDATION:
Since the Net Present Value is positive (+ ₹ 3,02,326) and the Profitability Index exceeds 1 (PI = 1.10), the acquisition of the CNC Machine is financially viable and should be accepted by Apex Engineering Ltd.`},{id:"desc_p2_gca_01",subjectId:"p2_law",chapterId:"general_clauses",type:"descriptive",importance:"LOW",source:"ICAI May 2022 Exam (Q5b - 4 Marks)",sourceYear:"May 2022",marks:4,difficulty:"Standard ICAI",icaiReference:"Section 10 of General Clauses Act, 1897",questionText:'State the provisions of Section 10 of the General Clauses Act, 1897 regarding "Computation of Time". A legal appeal was required to be filed in court on 15th August (a national public holiday). The appellant filed the appeal on 16th August when the court reopened. Examine whether the filing is within limitation.',rubrics:[{step:"Statement of Section 10 General Clauses Act",marks:2,expectedKeywords:["Section 10","Computation of Time","court or office closed on last day","done on the next day"],mandatoryCitations:["Section 10"],description:"Quote Section 10: Where any act is directed to be done on a day the court/office is closed, it shall be considered done if done on the next day."},{step:"Application and Validity",marks:2,expectedKeywords:["15th August is closed holiday","16th August reopening","validly filed within limitation"],description:"Apply to facts: Since 15th August is a national holiday, filing on 16th August is fully valid within limitation."}],suggestedAnswer:`1. Provision of Section 10 of General Clauses Act, 1897:
Under Section 10 of the General Clauses Act, 1897, where by any Central Act or Regulation, any act or proceeding is directed or allowed to be done or taken in any court or office on a certain day or within a prescribed period, then, if the court or office is closed on that day or the last day of the prescribed period, the act or proceeding shall be considered as done or taken in due time if it is done or taken on the next day on which the court or office is open.

2. Application to Given Case:
- The last date for filing the legal appeal fell on 15th August, which is a declared national public holiday (Independence Day), on which courts are closed.
- The appellant filed the appeal on the immediately following working day, 16th August, upon the reopening of the court.

3. Conclusion:
