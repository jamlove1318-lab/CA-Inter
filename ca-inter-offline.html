mum Level)",marks:2,difficulty:"Standard ICAI",icaiReference:"Stock Level Formulas",questionText:"Maximum consumption: 400 units/day; Maximum lead time: 6 days; Normal consumption: 300 units/day; Normal lead time: 5 days. What is the Reorder Level (ROL) and Minimum Stock Level?",trapNote:"Reorder Level = Maximum Usage × Maximum Lead Time. Minimum Level = ROL - (Normal Usage × Normal Lead Time).",explanation:"ROL = 400 × 6 = 2400 units. Minimum Level = 2400 - (300 × 5) = 2400 - 1,500 = 900 units."},"Reorder Level = 2400 units; Minimum Level = 900 units",["Reorder Level = 1,500 units; Minimum Level = 600 units","Reorder Level = 2,000 units; Minimum Level = 1,000 units","Reorder Level = 3,000 units; Minimum Level = 1,200 units"])}static generateCostingLabourBonus(){return w.buildShuffledMcq({id:`dyn_cost_halsey_${Date.now()}_${Math.floor(Math.random()*1e3)}`,subjectId:"p4_costing",chapterId:"employee_cost",type:"mcq",importance:"HIGH",source:"ICAI Dynamic Variant (Halsey Premium Bonus Scheme)",marks:2,difficulty:"Standard ICAI",icaiReference:"Halsey 50% Bonus Scheme",questionText:"Standard time allowed for a job is 10 hours. An operative completed it in 6 hours. The hourly wage rate is ₹ 50. Under the Halsey Scheme (50% sharing), what are the total earnings of the operative?",trapNote:"Halsey Total Earnings = (Hours Taken × Hourly Rate) + 50% of (Time Saved × Hourly Rate).",explanation:"Time Saved = 10 - 6 = 4 hours. Basic Wage = 6 × ₹ 50 = ₹ 300. Halsey Bonus = 50% × (4 × ₹ 50) = ₹ 100. Total Earnings = ₹ 300 + ₹ 100 = ₹ 400."},"₹ 400 (Basic ₹ 300 + Bonus ₹ 100)",["₹ 500 (Payment for 10 hours full standard time)","₹ 300 (Basic wage only without bonus)","₹ 450"])}static generateCostingOverheads(){return w.buildShuffledMcq({id:`dyn_cost_oh_${Date.now()}_${Math.floor(Math.random()*1e3)}`,subjectId:"p4_costing",chapterId:"overheads",type:"mcq",importance:"HIGH",source:"ICAI Dynamic Variant (Under/Over Absorption of Overheads)",marks:2,difficulty:"Standard ICAI",icaiRefere xpressed as per SA 705 (Revised)?",trapNote:"Adverse Opinion is expressed when evidence IS obtained and misstatements are BOTH material and pervasive. Disclaimer of Opinion is when evidence CANNOT be obtained and potential effects are material and pervasive.",explanation:"Under SA 705 (Revised) Para 8, the auditor shall express an Adverse Opinion when the auditor, having obtained sufficient appropriate audit evidence, concludes that misstatements are both material and pervasive to the financial statements."},"Adverse Opinion",["Disclaimer of Opinion",'Qualified Opinion ("Except for...")',"Unmodified Opinion with Key Audit Matter (KAM) paragraph"])}static generateAuditSa505(){return w.buildShuffledMcq({id:`dyn_audit_505_${Date.now()}_${Math.floor(Math.random()*1e3)}`,subjectId:"p5_audit",chapterId:"audit_evidence",type:"mcq",importance:"HIGH",source:"ICAI Dynamic Variant (SA 505 External Confirmations)",marks:2,difficulty:"Examiner Favorite",icaiReference:"SA 505 External Confirmations - Para 8",questionText:"During a statutory audit, management refuses to allow the auditor to send an external confirmation request to a major trade debtor. Under SA 505, what is the auditor's required immediate procedural duty?",trapNote:"The auditor must NOT immediately qualify or disclaim; the auditor must first inquire into reasons, seek evidence for validity, evaluate fraud risk, and perform alternative procedures.",explanation:"Under SA 505 Para 8, if management refuses, the auditor shall: (a) Inquire as to management reasons and seek audit evidence as to validity; (b) Evaluate implications on fraud risk assessment; and (c) Perform alternative audit procedures to obtain relevant and reliable audit evidence."},"Inquire as to management's reasons, evaluate validity and fraud risk, and perform alternative audit procedures",["Immediately issue a Disclaimer of Opinion without any inquiry","Accept management's oral explanation and verify subsequent recovery only","Report the management (ii) Calculate Diluted EPS for the year ended 31st March 2024.`,rubrics:[{step:"Weighted Average Number of Shares for Basic EPS",marks:3,expectedKeywords:["Bonus shares treated retrospectively from beginning","12,00,000 shares","WANES = 12,00,000"],mandatoryCitations:["AS 20"],description:"Bonus shares (2,00,000) are included as if issued on 1st April 2023. WANES = 12,00,000 shares."},{step:"Basic EPS Computation",marks:2,expectedKeywords:["Basic EPS = ₹ 5.00 per share","₹ 60,00,000 / 12,00,000"],description:"Basic EPS = 60,00,000 / 12,00,000 = ₹ 5.00 per share."},{step:"Diluted EPS Adjustment & Computation",marks:3,expectedKeywords:["Interest saved on conversion: ₹ 2,00,000","After-tax interest saving: ₹ 1,50,000","Adjusted Net Profit: ₹ 61,50,000","Incremental shares = 80,000","Diluted EPS = ₹ 4.80 per share"],description:"Add after-tax interest saved (₹ 1.5L) to numerator, add 80,000 potential equity shares to denominator. Diluted EPS = ₹ 4.80."}],suggestedAnswer:`1. Computation of Basic EPS as per AS 20:
- Opening Equity Shares = 10,00,000
- Bonus Issue (1 for 5) = 10,00,000 / 5 = 2,00,000 shares.
- Principle: As per AS 20, bonus shares do not bring any inflow of cash resources, hence they are treated as if they were in issue from the earliest reporting period (i.e. retrospectively from 1st April 2023).
- Weighted Average Number of Equity Shares (WANES) = 10,00,000 + 2,00,000 = 12,00,000 Shares.

  Basic EPS = ₹ 60,00,000 / 12,00,000 = ₹ 5.00 per share.

2. Computation of Diluted EPS:

(i) State the quorum required for a general meeting of a public company under Section 103.

(iii) State what happens if the meeting was called upon the requisition of members under Section 100 instead of by the Board.
(iv) What is the legal quorum rule at the adjourned meeting if quorum is still not present within half an hour?`,rubrics:[{step:"Statutory Quorum Thresholds for Public Company",marks:2,expectedKeywords:["Section 103","5 members if <= 1000","15 members if 1001 to 5000","30 members if > 5000","Quorum required = 15 members"],mandatoryCitations:["Section 103(1)(a)"],description:"For 3,200 members, the required quorum is 15 members personally present."},{step:"Consequences of Quorum Absence within 30 Minutes",marks:2,expectedKeywords:["Adjourned to same day in next week","Same time and place","Board may determine other day/time"],mandatoryCitations:["Section 103(2)(a)"],description:"Meeting stands adjourned to the same day in next week at same time and place."},{step:"Requisitioned Meeting vs Board Called Meeting",marks:1,expectedKeywords:["Meeting called by requisitionists shall stand cancelled / dissolved"],mandatoryCitations:["Section 103(2)(b)"],description:"If called upon requisition, the meeting stands cancelled."},{step:"Quorum Rule at Adjourned Meeting",marks:1,expectedKeywords:["Members present shall be the quorum","Section 103(3)"],mandatoryCitations:["Section 103(3)"],description:"At adjourned meeting, members present personally shall be the quorum."}],suggestedAnswer:`1. Statutory Quorum for Public Company [Section 103(1)(a)]:
Under Section 103 of the Companies Act, 2013, the quorum personally present for a public company is:
- 5 members if total members <= 1,000;
- 15 members if total members exceed 1,000 but up to 5,000;
- 30 members if total members exceed 5,000.
Since Royal Lifestyle Ltd has 3,200 members, the mandatory quorum is 15 members personally present. With only 11 members present, quorum is not formed.

2. Consequence of Absence of Quorum [Section 103(2)]:
If quorum is not present within half an hour from the appointed time:
- The meeting shall stand adjourned to the same day in the next week at the same time and place, or to such other date, time, and place as the Board may determine.

3. Exception for Requisitioned Meeting [Section 103(2)(b)]:

- Provision: Under Section 141(3)(d)(i) read with Rule 10 of Companies (Audit and Auditors) Rules, 2014, a person is disqualified if he, his partner, or his relative holds any security in the company.
- Proviso: A relative may hold security in the company of FACE VALUE not exceeding ₹ 1,00,000.
- Analysis: The threshold applies strictly to FACE VALUE, not market value. Since the brother (a relative under Section 2(77)) holds shares of face value ₹ 80,000 (which is within ₹ 1,00,000), CA Alok is ELIGIBLE and NOT DISQUALIFIED.

2. Case 2 - Father indebted for ₹ 6,20,000:

- Exclusions: Qualified Institutional Buyers (QIBs) and employees offered securities under employee stock option (ESOP) are excluded from calculating this 200-person ceiling.

2. Allotment Timeline [Section 42(6)]:
- A company making an offer under Section 42 shall allot its securities within 60 DAYS from the date of receipt of the application money.

3. Failure to Allot within 60 Days:
- If the company is unable to allot the securities within 60 days, it shall repay the application money to the subscribers within 15 DAYS from the expiry of the 60 days.
- If failed to repay within 15 days, the company and every officer in default shall be liable to repay that money with interest @ 12% per annum from the expiry of the 60th day.

4. Bank Account & Return of Allotment [Section 42(6) & 42(8)]:

- The company must file a Return of Allotment in Form PAS-3 with the Registrar within 15 DAYS of allotment.`}}static generateTaxSection50CQuestion(){return{id:`dyn_desc_sec50c_${Date.now()}_${Math.floor(Math.random()*1e3)}`,subjectId:"p3_tax",chapterId:"cap_gains",type:"descriptive",importance:"HIGH",source:"ICAI Exam Style: Section 50C Full Value of Consideration & 110% Tolerance Limit",marks:6,difficulty:"Examiner Favorite",icaiReference:"Section 50C, Income-tax Act, 1961",questionText:`Mr. Rajesh entered into an agreement to sell a commercial plot on 12th August 2023 for a total consideration of ₹ 80,00,000. He received an advance token of ₹ 8,00,000 by an account payee cheque on the date of agreement.

(ii) Determine the Full Value of Consideration (FVOC) for calculating capital gains under Section 50C, explaining the 110% safe harbour tolerance limit.
(iii) How would your answer change if the advance token of ₹ 8,00,000 was received in cash?`,rubrics:[{step:"Relevant Date for Stamp Duty Value (Agreement Date vs Registration Date)",marks:2,expectedKeywords:["Section 50C First Proviso","Token money received by account payee cheque","SDV on date of agreement is adopted (₹ 87,00,000)"],mandatoryCitations:["Section 50C"],description:"Agreement date SDV applies since advance received by account payee cheque on or before agreement date."},{step:"Application of 110% Safe Harbour Tolerance Limit",marks:3,expectedKeywords:["110% of Consideration = ₹ 88,00,000","SDV ₹ 87,00,000 does not exceed 110%","FVOC = Actual Consideration = ₹ 80,00,000"],mandatoryCitations:["Section 50C(1) Proviso 3"],description:"110% of ₹ 80L = ₹ 88L. Since SDV (₹ 87L) <= ₹ 88L, actual consideration (₹ 80L) is adopted as FVOC."},{step:"Scenario if Advance was in Cash",marks:1,expectedKeywords:["Cash advance invalidates agreement date SDV","SDV on date of registration (₹ 95,00,000) applies","FVOC = ₹ 95,00,000"],description:"If cash advance, registration date SDV (₹ 95L) applies, exceeding 110% (₹ 88L), so FVOC = ₹ 95 Lakhs."}],suggestedAnswer:`1. Relevant Date for Stamp Duty Value [First Proviso to Section 50C(1)]:
- Principle: Where the date of agreement fixing the amount of consideration and the date of registration are not the same, the Stamp Duty Value on the DATE OF AGREEMENT may be taken, provided the consideration or part thereof has been received by way of an account payee cheque/draft or ECS on or before the date of agreement.
- Application: Since Mr. Rajesh received ₹ 8,00,000 by account payee cheque on the agreement date, the SDV on the date of agreement (₹ 87,00,000) shall be taken instead of registration date SDV (₹ 95,00,000).

2. 110% Safe Harbour Tolerance Limit [Third Proviso to Section 50C(1)]:
- Principle: If the Stamp Duty Value does not exceed 110% of the actual consideration received, the actual consideration shall be deemed to be the Full Value of Consideration (FVOC).
- 110% of Actual Consideration = 110% × ₹ 80,00,000 = ₹ 88,00,000.

(b) Evaluate the implications of management's refusal on the auditor's assessment of the relevant risks of material misstatement, including the risk of fraud, and on the nature, timing, and extent of other audit procedures.

(a) Incentive or Pressure: Management or employees have an incentive or are under pressure (e.g. meeting ambitious analyst earnings targets, debt covenants, or bonus benchmarks).
(b) Opportunity: Circumstances exist that provide an opportunity to commit fraud (e.g. ineffective internal controls, complex transactions, lack of segregation of duties).

2. Mandatory Procedures to Address Management Override of Controls [SA 240 Para 32]:

- Plan 2: N2 = 2,50,000 Equity Shares; Interest (I2) = 12% of ₹ 25,00,000 = ₹ 3,00,000.
