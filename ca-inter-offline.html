During the Financial Year 2023-24, the following transactions and corporate events occurred:

1. Financial Position as of 31st March 2023:
   - Paid-up Equity Share Capital: ₹ 20 Crores (2 Crore shares of ₹ 10 each)
   - Free Reserves & Securities Premium: ₹ 85 Crores
   - Borrowings from Scheduled Banks: ₹ 110 Crores
   - Turnover for FY 2022-23: ₹ 1,020 Crores
   - Net Profit for FY 2022-23: ₹ 8.5 Crores (preceding FY 2021-22: ₹ 6.5 Cr; FY 2020-21: ₹ 4.0 Cr)

2. Corporate Actions & Meetings:
   - The company held its Annual General Meeting (AGM) on 28th September 2023. Notice of AGM was emailed on 8th September 2023 (19 clear days before meeting). 92% of the members entitled to vote gave consent in writing for calling AGM at shorter notice.
   - The Board approved a CSR policy and earmarked funds for setting up an organic farming skill center (an ongoing project with a 3-year execution timeline). The amount budgeted was ₹ 15 Lakhs, but by 31st March 2024, only ₹ 6 Lakhs was actually disbursed.

3. Tax & GST Matters:
   - The company paid ₹ 12 Lakhs as sitting fees and commission to its independent non-executive directors. The company accountant was uncertain whether GST is applicable under Reverse Charge Mechanism (RCM) or Forward Charge.
   - In December 2023, the company purchased an industrial land parcel for ₹ 2.5 Crores; however, the Stamp Duty Authority determined the circle rate value at ₹ 3.2 Crores.`,mcqs:[{id:"case_01_mcq_1",subjectId:"p2_law",chapterId:"mgmt_admin",type:"mcq",importance:"HIGH",source:"Case Scenario Q1",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 101(1) Companies Act, 2013",questionText:"Regarding the calling of the Annual General Meeting at shorter notice with consent of 92% of members, is the meeting legally valid under Section 101 of the Companies Act, 2013?",options:[{id:"a",text:"No, because for an AGM, consent of not less than 95% of members entitled to vote is mandatory"},{id:"b",text:"Yes, because consent of more than 90% of members is sufficient for any general meeting"},{id:"c",text:"Yes, because 21 days notice rule does not apply to unlisted public companies"},{id:"d",text:"No, because an AGM cannot be held at shorter notice under any circumstance"}],correctOptionId:"a",trapNote:"For an AGM, the shorter notice threshold is strictly not less than 95% of members entitled to vote. For an EGM, it is majority in number + 95% of paid-up capital.",explanation:"Under Section 101(1) of the Companies Act, 2013, a general meeting may be called after giving shorter notice if consent, in writing or by electronic mode, is accorded in the case of an AGM, by not less than 95% of the members entitled to vote thereat. Since only 92% consented, the shorter notice was invalid."},{id:"case_01_mcq_2",subjectId:"p3_tax",chapterId:"gst_supply_charge",type:"mcq",importance:"HIGH",source:"Case Scenario Q2",marks:2,difficulty:"Examiner Favorite",icaiReference:"Notification No. 13/2017 - Central Tax (Rate) - Reverse Charge",questionText:"Regarding the sitting fees and commission of ₹ 12 Lakhs paid to independent directors, what is the GST liability and mechanism?",options:[{id:"a",text:"The independent directors must register and pay GST under forward charge"},{id:"b",text:"Apex Agrochem Ltd. is liable to pay GST under Reverse Charge Mechanism (RCM) under Section 9(3)"},{id:"c",text:"It is an employer-employee transaction covered in Schedule III, hence outside GST"},{id:"d",text:"Exempt from GST if director income is below ₹ 20 Lakhs"}],correctOptionId:"b",trapNote:"Whole-time directors drawing salary subject to TDS u/s 192 are Schedule III (exempt). Non-executive / independent directors receiving sitting fees are taxable under RCM paid by company!",explanation:"As per Notification No. 13/2017-CT(Rate), services supplied by a director of a company or a body corporate to the said company/body corporate are subject to GST under Reverse Charge Mechanism (RCM), where the company is liable to discharge GST."}],descriptiveQuestions:[{id:"case_01_desc_1",subjectId:"p2_law",chapterId:"accounts_csr",type:"descriptive",importance:"HIGH",source:"Case Scenario Q3 (Descriptive - 6 Marks)",marks:6,difficulty:"Examiner Favorite",icaiReference:"Section 135(5) & 135(6) Companies Act, 2013",questionText:`With reference to the organic farming ongoing project:
(i) Compute the exact statutory CSR liability of Apex Agrochem Ltd for FY 2023-24 based on its 3-year net profits.
(ii) Explain the statutory procedure and timeline the company must follow for the unspent CSR amount of ₹ 9 Lakhs (budgeted ₹ 15 Lakhs minus ₹ 6 Lakhs spent) as of 31st March 2024 under Section 135(6).`,rubrics:[{step:"Computation of Statutory CSR Obligation",marks:2,expectedKeywords:["Average Net Profit: (8.5 + 6.5 + 4.0)/3 = ₹ 6.33 Crores","2% of ₹ 6.33 Cr = ₹ 12.67 Lakhs"],description:"Average profit = 19.0 / 3 = ₹ 6.333 Crores. 2% = ₹ 12.67 Lakhs."},{step:"Statutory Procedure under Section 135(6) for Ongoing Project",marks:3,expectedKeywords:["Section 135(6)","30 days from end of FY (by 30th April 2024)","Unspent CSR Account","Scheduled Bank","spend within 3 financial years"],mandatoryCitations:["Section 135(6)"],description:"Explain transfer of unspent balance relating to ongoing project to Unspent CSR Account within 30 days."},{step:"Failure to spend within 3 years consequences",marks:1,expectedKeywords:["transfer to Fund specified in Schedule VII","within 30 days of 3rd FY end","PM CARES or Clean Ganga"],description:"State that if not spent in 3 FYs, balance must be transferred to Schedule VII fund."}],suggestedAnswer:`(i) Statutory CSR Liability for FY 2023-24:
Average Net Profit of preceding 3 financial years:
- FY 2022-23: ₹ 8.50 Crores
- FY 2021-22: ₹ 6.50 Crores
- FY 2020-21: ₹ 4.00 Crores
Total Net Profit = ₹ 19.00 Crores
Average Net Profit = ₹ 19.00 Cr / 3 = ₹ 6.333 Crores.

Minimum Statutory CSR Obligation (2% of Average Net Profit) = 2% × ₹ 6.333 Crores = ₹ 0.1267 Crores = ₹ 12.67 Lakhs.
(The company budgeted ₹ 15 Lakhs, which is higher than the statutory minimum of ₹ 12.67 Lakhs).

(ii) Statutory Compliance for Unspent Amount [Section 135(6)]:
As the organic farming skill center is an "ongoing project":
1. The unspent amount (Statutory unspent = ₹ 12.67L - ₹ 6L = ₹ 6.67 Lakhs, or budgeted unspent ₹ 9 Lakhs) must be transferred to a special bank account opened in any scheduled bank called "Unspent Corporate Social Responsibility Account".
2. Time limit: Within 30 days from the closure of the financial year (i.e., on or before 30th April 2024).
3. Utilization: The funds in this account must be utilized exclusively for the ongoing project within a period of 3 financial years from the date of transfer (i.e., by 31st March 2027).
4. Failure to spend: If the company fails to spend the amount within the said 3 financial years, the remaining unspent balance must be transferred to a Fund specified in Schedule VII (such as Prime Minister's National Relief Fund or PM CARES Fund) within 30 days from the date of completion of the third financial year.`}]},{id:"case_02_audit_cost",subjectId:"p5_audit",chapterId:"audit_evidence",title:"Integrated Case Scenario: Starlight Electronics Ltd (Physical Inventory, AS 2 & SA 501)",source:"ICAI Integrated Case Study (May 2024 Pattern)",importance:"HIGH",totalMarks:15,scenarioText:`Starlight Electronics Ltd. manufactures smart LED panels and semiconductors in Noida. The company's inventory as on 31st March 2024 is valued at ₹ 42 Crores, which represents 38% of total assets.

During the year-end statutory audit, the engagement team headed by CA. Vikram encountered the following issues:

1. Inventory Verification & Access:
   - The company conducted physical inventory verification at its primary warehouse on 31st March 2024. However, due to unexpected toxic gas leakage in the specialized semiconductor clean-room, CA. Vikram and his team were physically barred from attending the inventory count on that date.
   - Management conducted the physical count on 12th April 2024 after decontamination and provided CA. Vikram with their count sheets.

2. Valuation Discrepancies under AS 2:
   - 10,000 finished OLED display units had a manufacturing cost of ₹ 8,000 each (Total ₹ 8 Crores). Due to technological obsolescence from a new 4K model, the current market selling price had fallen to ₹ 7,200 each, with selling expenses estimated at ₹ 400 per unit. Management valued these at original cost ₹ 8,000 per unit arguing that technology markets will rebound.
   - Normal spoilage in semiconductor manufacturing is 2%, but in FY 2023-24, abnormal spoilage was 7% due to power grid voltage fluctuations. Management capitalized the ₹ 1.2 Crore abnormal loss into product cost.`,mcqs:[{id:"case_02_mcq_1",subjectId:"p5_audit",chapterId:"audit_evidence",type:"mcq",importance:"HIGH",source:"Case Scenario Q1",marks:2,difficulty:"Examiner Favorite",icaiReference:"SA 501 Audit Evidence - Specific Considerations for Selected Items",questionText:"When physical inventory count attendance is impracticable due to unforeseen safety issues on the balance sheet date, what is the auditor’s duty under SA 501?",options:[{id:"a",text:"Immediately issue an adverse audit report without testing"},{id:"b",text:"Accept management representation letter as sole conclusive evidence"},{id:"c",text:"Perform alternative audit procedures, or observe count on an alternative date and perform audit procedures on intervening transactions"},{id:"d",text:"Resign from the audit engagement immediately"}],correctOptionId:"c",trapNote:"SA 501 specifically provides for alternative date counts + roll-back/roll-forward procedures on intervening transactions.",explanation:"Under SA 501 Para 7, if attendance at physical inventory counting is impracticable, the auditor shall perform alternative audit procedures to obtain sufficient appropriate audit evidence regarding the existence and condition of inventory. If possible, perform or observe physical counts on an alternative date, and perform audit procedures on intervening transactions."},{id:"case_02_mcq_2",subjectId:"p1_adv_acc",chapterId:"as_revenue_inv",type:"mcq",importance:"HIGH",source:"Case Scenario Q2",marks:2,difficulty:"Examiner Favorite",icaiReference:"AS 2 Valuation of Inventories - Para 5 & 13",questionText:"What is the correct valuation per unit of the 10,000 finished OLED display units as per AS 2?",options:[{id:"a",text:"₹ 8,000 per unit (Original Cost)"},{id:"b",text:"₹ 7,200 per unit (Gross Selling Price)"},{id:"c",text:"₹ 7,600 per unit (Average of Cost and Selling Price)"},{id:"d",text:"₹ 6,800 per unit (Net Realisable Value = ₹ 7,200 - ₹ 400)"}],correctOptionId:"d",trapNote:"Net Realisable Value is Estimated Selling Price LESS Estimated Costs necessary to make the sale. 7,200 - 400 = 6,800. Since 6,800 < Cost of 8,000, value at 6,800.",explanation:"As per AS 2, inventories should be valued at the lower of cost and Net Realisable Value (NRV). NRV = Estimated selling price in ordinary course of business less estimated costs of completion and estimated costs necessary to make the sale = ₹ 7,200 - ₹ 400 = ₹ 6,800. Since NRV (₹ 6,800) is lower than Cost (₹ 8,000), inventory must be written down to ₹ 6,800, creating an inventory write-down loss of ₹ 1,200 per unit (Total ₹ 1.2 Crores)."}],descriptiveQuestions:[{id:"case_02_desc_1",subjectId:"p5_audit",chapterId:"audit_fs_items",type:"descriptive",importance:"HIGH",source:"Case Scenario Q3 (Descriptive - 6 Marks)",marks:6,difficulty:"Examiner Favorite",icaiReference:"SA 501, AS 2 & SA 705",questionText:"Analyze the auditor's course of action and reporting obligations if management refuses to write down the finished OLED inventory to NRV (overstatement of ₹ 1.2 Crores) and insists on capitalizing abnormal spoilage of ₹ 1.2 Crores (total misstatement ₹ 2.4 Crores against materiality of ₹ 1.5 Crores).",rubrics:[{step:"Assessment of Material Misstatement",marks:2,expectedKeywords:["Total Misstatement: ₹ 2.4 Crores","Exceeds materiality of ₹ 1.5 Crores","Violation of AS 2 Para 5 and Para 13"],description:"Evaluate that ₹ 1.2 Cr inventory write-down + ₹ 1.2 Cr abnormal spoilage = ₹ 2.4 Cr total misstatement exceeds materiality."},{step:"Communication with TCWG",marks:2,expectedKeywords:["Communicate with TCWG","Request correction in Financial Statements","SA 450 Evaluation of Misstatements"],description:"Auditor must request management and TCWG to adjust financial statements."},{step:"Audit Opinion Modification under SA 705",marks:2,expectedKeywords:["Qualified Opinion","Material but not pervasive","Basis for Qualified Opinion"],mandatoryCitations:["SA 705"],description:'If management refuses, issue Qualified Opinion ("Except for the effects of...") as the misstatement is material but not pervasive to the statements as a whole.'}],suggestedAnswer:`1. Evaluation of Misstatements:
- Finished Goods Valuation: AS 2 mandates valuation at Lower of Cost (₹ 8,000) or NRV (₹ 6,800). Failure to write down leads to inventory overstatement of (10,000 units × ₹ 1,200) = ₹ 1.20 Crores.
- Abnormal Spoilage: AS 2 explicitly requires abnormal amounts of wasted materials to be excluded from product cost and charged to P&L. Capitalizing ₹ 1.20 Crores into inventory violates AS 2.
- Total Cumulative Misstatement = ₹ 1.20 Cr + ₹ 1.20 Cr = ₹ 2.40 Crores.
- Since ₹ 2.40 Crores exceeds the audit planning materiality of ₹ 1.50 Crores, the misstatement is MATERIAL.

2. Auditor's Action under SA 450:
- CA. Vikram must formally communicate these uncorrected misstatements to those charged with governance (TCWG) and request management to adjust the financial statements.

3. Audit Reporting Implications under SA 705 (Revised):
- If management refuses to make the adjustments:
  - Misstatements are material (₹ 2.40 Cr > ₹ 1.50 Cr) but are confined to inventory and related cost of sales (not pervasive to the whole financial statements).
  - Therefore, CA. Vikram must express a QUALIFIED OPINION.
- Reporting Requirements:
  - Heading: "Qualified Opinion".
  - Opinion wording: State that "Except for the effects of the matter described in the Basis for Qualified Opinion section, the financial statements give a true and fair view...".
  - Include "Basis for Qualified Opinion" quantifying the overstatement of inventory by ₹ 2.40 Crores and overstatement of Profit Before Tax by ₹ 2.40 Crores.`}]},{id:"case_03_cost_fm",subjectId:"p4_costing",chapterId:"marginal_costing",title:"Integrated Case Scenario: Nova Automotive Ltd (Marginal Costing, Make or Buy & Leverages)",source:"ICAI Integrated Case Study (RTP May 2024 Pattern)",importance:"HIGH",totalMarks:15,scenarioText:`Nova Automotive Ltd. manufactures electric two-wheeler motors in Chennai. The installed capacity is 50,000 motors per annum, and the current operating capacity utilization is 70% (35,000 units).

Cost and financial structure for the current year are as follows:
1. Per Unit Cost Structure (at 35,000 units):
   - Direct Materials: ₹ 1,200
   - Direct Labour: ₹ 600
   - Variable Manufacturing Overheads: ₹ 400
   - Fixed Manufacturing Overheads: ₹ 500 (Total Fixed OH = ₹ 1,75,00,000)
   - Total Manufacturing Cost: ₹ 2,700
   - Selling Price per unit: ₹ 3,600

2. Special Export Order Proposal:
   - A multinational fleet operator from Vietnam offers to purchase 10,000 units at a special export offer price of ₹ 2,500 per unit.
   - Additional export packaging and sea freight will cost ₹ 100 per unit.
   - No additional fixed costs will be incurred, and domestic sales price and volume will not be impacted.

3. Capital Structure & Financing:
   - Nova Automotive Ltd has an existing 12% Bank Term Loan of ₹ 2.5 Crores (Annual Interest = ₹ 30 Lakhs).
   - Equity Share Capital: ₹ 5 Crores (50 Lakh shares of ₹ 10 each).
   - Corporate Tax rate is 25%.`,mcqs:[{id:"case_03_mcq_1",subjectId:"p4_costing",chapterId:"marginal_costing",type:"mcq",importance:"HIGH",source:"Case Scenario Q1",marks:2,difficulty:"Examiner Favorite",icaiReference:"Marginal Costing - Export Order & Relevant Costing",questionText:"What is the incremental contribution per unit from accepting the special export order of 10,000 units from Vietnam?",options:[{id:"a",text:"- ₹ 200 per unit (Loss of ₹ 20,00,000 against total cost)"},{id:"b",text:"₹ 200 per unit (Profit of ₹ 20,00,000)"},{id:"c",text:"₹ 100 per unit (Profit of ₹ 10,00,000)"},{id:"d",text:"₹ 300 per unit (Profit of ₹ 30,00,000)"}],correctOptionId:"b",trapNote:"Fixed overheads are SUNK and irrelevant for spare capacity export order! Relevant variable cost = 1200 + 600 + 400 + 100 (special packaging) = ₹ 2,300.",explanation:"Relevant Variable Cost per unit for export = Direct Material (₹ 1,200) + Direct Labour (₹ 600) + Variable OH (₹ 400) + Export Packaging (₹ 100) = ₹ 2,300. Incremental Contribution per unit = Export Selling Price (₹ 2,500) - Relevant Cost (₹ 2,300) = ₹ 200 per unit. Total incremental profit = 10,000 × ₹ 200 = ₹ 20,00,000. Since capacity exists (15,000 idle units), the order should be accepted."},{id:"case_03_mcq_2",subjectId:"p6_fm_sm",chapterId:"fm_leverages",type:"mcq",importance:"HIGH",source:"Case Scenario Q2",marks:2,difficulty:"Examiner Favorite",icaiReference:"Degree of Financial Leverage (DFL = EBIT / EBT)",questionText:"Assuming current domestic operations generate EBIT of ₹ 3,15,00,000, what is the Degree of Financial Leverage (DFL)?",options:[{id:"a",text:"1.250"},{id:"b",text:"1.000"},{id:"c",text:"1.105 (EBIT ₹ 3.15 Cr / EBT ₹ 2.85 Cr)"},{id:"d",text:"1.420"}],correctOptionId:"c",trapNote:"DFL = EBIT / (EBIT - Interest) = ₹ 3,15,00,000 / (₹ 3,15,00,000 - ₹ 30,00,000) = 315 / 285 = 1.105.",explanation:"EBIT = ₹ 3,15,00,000. Interest = ₹ 30,00,000. EBT = ₹ 3,15,00,000 - ₹ 30,00,000 = ₹ 2,85,00,000. Degree of Financial Leverage (DFL) = EBIT / EBT = 3,15,00,000 / 2,85,00,000 = 1.105."}],descriptiveQuestions:[{id:"case_03_desc_1",subjectId:"p4_costing",chapterId:"marginal_costing",type:"descriptive",importance:"HIGH",source:"Case Scenario Q3 (Descriptive - 6 Marks)",marks:6,difficulty:"Examiner Favorite",icaiReference:"Break-Even Analysis, Margin of Safety & Export Order Decision",questionText:`Based on the domestic operating parameters of Nova Automotive Ltd:
(i) Calculate the domestic Break-Even Point (in units and value) and the Margin of Safety percentage.
(ii) Advise management with detailed calculations whether the Vietnam export order should be accepted and show the overall revised profit of the company after accepting the order.`,rubrics:[{step:"Break-Even Point and Margin of Safety Computation",marks:3,expectedKeywords:["Contribution per unit = ₹ 1,400","BEP units = 12,500 units","BEP Value = ₹ 4,50,00,000","Margin of Safety % = 64.29%"],description:"Contribution = 3,600 - 2,200 = ₹ 1,400/unit. BEP = 1,75,00,000 / 1,400 = 12,500 units. MOS % = (35,000 - 12,500)/35,000 = 64.29%."},{step:"Evaluation of Export Order and Revised Profitability",marks:3,expectedKeywords:["Idle capacity = 15,000 units","Accept export order","Incremental contribution = ₹ 20,00,000","Revised Total EBIT = ₹ 3,35,00,000"],description:"State that since 15,000 units capacity is idle and incremental contribution is positive (₹ 20 Lakhs), accept order. Revised EBIT = ₹ 3.15 Cr + ₹ 0.20 Cr = ₹ 3.35 Crores."}],suggestedAnswer:`1. Domestic Break-Even Point & Margin of Safety:
- Selling Price per unit = ₹ 3,600
- Variable Cost per unit = Direct Material (₹ 1,200) + Direct Labour (₹ 600) + Variable OH (₹ 400) = ₹ 2,200
- Contribution per unit = ₹ 3,600 - ₹ 2,200 = ₹ 1,400 per unit
- P/V Ratio = (₹ 1,400 / ₹ 3,600) × 100 = 38.89%
- Total Fixed Overheads = ₹ 1,75,00,000
- Break-Even Point (in units) = Fixed Costs / Contribution per unit = ₹ 1,75,00,000 / ₹ 1,400 = 12,500 units
- Break-Even Point (in value) = 12,500 units × ₹ 3,600 = ₹ 4,50,00,000
- Margin of Safety (in units) = Actual Sales (35,000) - BEP Sales (12,500) = 22,500 units
- Margin of Safety (%) = (22,500 / 35,000) × 100 = 64.29%

2. Evaluation and Advice on Special Export Order:
- Available Idle Capacity = Installed Capacity (50,000) - Current Domestic (35,000) = 15,000 units.
- The export order requires 10,000 units, which is well within the idle capacity of 15,000 units.
- Export Selling Price = ₹ 2,500 per unit
- Relevant Variable Cost = Domestic Variable Cost (₹ 2,200) + Special Packaging (₹ 100) = ₹ 2,300 per unit
- Incremental Contribution = ₹ 2,500 - ₹ 2,300 = ₹ 200 per unit
- Total Incremental Profit from Export = 10,000 units × ₹ 200 = ₹ 20,00,000.
Recommendation: The company should accept the export order as it utilizes idle capacity and contributes ₹ 20,00,000 directly to net profit without increasing fixed overheads.
Revised Operating Profit (EBIT) = Current Domestic EBIT (₹ 3,15,00,000) + Export Profit (₹ 20,00,000) = ₹ 3,35,00,000.`}]},{id:"case_04_tax_law",subjectId:"p3_tax",chapterId:"capital_gains",title:"Integrated Case Scenario: Zenith Infotech & Director Disqualifications (Taxation & Corporate Law)",source:"ICAI Integrated Case Study (Nov 2024 Pattern)",importance:"HIGH",totalMarks:15,scenarioText:`Zenith Infotech Pvt Ltd is an Indian software consultancy company headquartered in Bengaluru.

Key events during the financial year 2023-24 (AY 2024-25):
1. Transfer of Commercial Property & Section 50C:
   - On 15th October 2023, Zenith Infotech sold an office building in Whitefield for ₹ 3.5 Crores.
   - The agreement to sell was entered on 1st March 2023 with an advance of ₹ 30 Lakhs received via account payee bank draft.
   - Stamp Duty Value (SDV) on 1st March 2023 was ₹ 3.7 Crores.
   - SDV on registration date (15th October 2023) was ₹ 4.1 Crores.
   - The company's tax consultant is debating whether SDV of March 2023 or October 2023 applies.

2. Director Meetings & Compliance under Companies Act:
   - The company has 4 directors. A Board meeting was convened on 20th November 2023. Notice of meeting was given only 3 days prior. 
   - Director Mr. Alok was in the US and attended via video-conferencing.
   - Another director, Mr. Raman, has not filed his annual financial returns and statements for 3 consecutive financial years in another private company where he is also a director.`,mcqs:[{id:"case_04_mcq_1",subjectId:"p3_tax",chapterId:"capital_gains",type:"mcq",importance:"HIGH",source:"Case Scenario Q1",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 50C Provisos - Agreement Date SDV vs Registration Date SDV",questionText:"For computing capital gains under Section 50C, which Stamp Duty Value should be taken as the benchmark, and is any full value of consideration adjustment required?",options:[{id:"a",text:"SDV on registration date (₹ 4.1 Cr) must mandatorily be taken in all circumstances"},{id:"b",text:"₹ 4.1 Crores is deemed consideration because advance was not paid in cash"},{id:"c",text:"The average of ₹ 3.7 Cr and ₹ 4.1 Cr must be taken"},{id:"d",text:"SDV on agreement date (₹ 3.7 Cr) is considered, and since it is within 110% of agreed consideration (₹ 3.85 Cr), actual consideration ₹ 3.5 Cr is taken"}],correctOptionId:"d",trapNote:"First proviso to Section 50C: If consideration or part thereof is received by account payee cheque/draft/ECS on or before the date of agreement, SDV on the date of agreement (₹ 3.7 Cr) applies! 110% of ₹ 3.5 Cr = ₹ 3.85 Cr. Since ₹ 3.7 Cr <= ₹ 3.85 Cr, no addition is made under Section 50C!",explanation:"Under the first proviso to Section 50C, where the date of agreement and registration are not the same, the SDV on the date of agreement can be taken provided part consideration was received by banking channels on or before agreement date. Here ₹ 30 Lakhs was received via bank draft. Therefore, agreement date SDV (₹ 3.7 Cr) applies. Furthermore, under the third proviso, if SDV does not exceed 110% of agreed consideration (₹ 3.5 Cr × 110% = ₹ 3.85 Cr), the actual consideration of ₹ 3.5 Crores is treated as Full Value of Consideration."},{id:"case_04_mcq_2",subjectId:"p2_law",chapterId:"mgmt_admin",type:"mcq",importance:"HIGH",source:"Case Scenario Q2",marks:2,difficulty:"Examiner Favorite",icaiReference:"Section 164(2) Disqualification of Directors",questionText:"What is the legal consequence for Mr. Raman regarding his directorship under Section 164(2) of the Companies Act, 2013 for non-filing of financial statements for 3 consecutive years?",options:[{id:"a",text:"Disqualified from being re-appointed in that company or appointed in any other company for 5 years, and must vacate office under Section 167(1)(a)"},{id:"b",text:"Only a monetary penalty of ₹ 50,000 with no disqualification"},{id:"c",text:"Disqualified for only 1 year provided fine is paid"},{id:"d",text:"No impact on directorship in other companies"}],correctOptionId:"a",trapNote:"Section 164(2)(a) imposes 5-year disqualification across all companies and triggers vacation of office under Section 167(1)(a).",explanation:"Under Section 164(2)(a) of the Companies Act, 2013, no person who is or has been a director of a company which has not filed financial statements or annual returns for any continuous period of three financial years shall be eligible to be re-appointed as a director of that company or appointed in other company for a period of five years. Under Section 167(1)(a), the office of director becomes vacant in all companies other than the defaulting company."}],descriptiveQuestions:[{id:"case_04_desc_1",subjectId:"p2_law",chapterId:"mgmt_admin",type:"descriptive",importance:"HIGH",source:"Case Scenario Q3 (Descriptive - 6 Marks)",marks:6,difficulty:"Examiner Favorite",icaiReference:"Section 173(3) Board Meeting at Shorter Notice & Video Conferencing Rules",questionText:`Examine the legal validity of the Board Meeting of Zenith Infotech Pvt Ltd held on 20th November 2023 with reference to:
(i) Calling the Board meeting with only 3 days notice under Section 173(3).
(ii) Attendance of Director Mr. Alok via video conferencing and requirements for valid quorum under Section 174 and Rule 3 of Companies (Meetings of Board and its Powers) Rules, 2014.`,rubrics:[{step:"Provisions regarding Notice of Board Meeting under Section 173(3)",marks:3,expectedKeywords:["Section 173(3)","Not less than 7 days notice in writing","Shorter notice valid if at least one Independent Director is present","Private company or ratification by majority"],mandatoryCitations:["Section 173(3)"],description:"State that statutory notice is 7 days. Shorter notice is permissible to transact urgent business if at least 1 independent director is present, or if ratified by majority of directors."},{step:"Participation via Video Conferencing & Quorum Validity",marks:3,expectedKeywords:["Section 173(2)","Rule 3 Video Conferencing","counted for quorum under Section 174","roll call and integrity of proceedings"],mandatoryCitations:["Section 173(2)","Section 174"],description:"Confirm that participation via video-conferencing is legally recognized for both attendance and quorum under Section 174."}],suggestedAnswer:`(i) Validity of Shorter Notice for Board Meeting [Section 173(3)]:
1. General Statutory Rule: As per Section 173(3) of the Companies Act, 2013, a meeting of the Board shall be called by giving not less than seven (7) days notice in writing to every director at his registered address by hand delivery, post, or electronic means.
2. Shorter Notice Exception: A Board meeting may be called at shorter notice to transact urgent business subject to the condition that at least one independent director, if any, shall be present at the meeting.
3. In the case of a private company (which does not require independent directors), or where no independent director is present, decisions taken at such a shorter notice meeting shall be circulated to all directors and shall be final only on ratification by at least one independent director or majority of directors.
Hence, the meeting called at 3 days notice is valid subject to ratification by majority of directors.

(ii) Participation via Video Conferencing and Quorum [Section 173(2) & 174]:
1. Under Section 173(2) read with Rule 3 of Companies (Meetings of Board and its Powers) Rules, 2014, directors may participate in Board meetings in person or through video conferencing or other audio-visual means capable of recording and recognizing the participation.
2. Quorum under Section 174: Directors participating through video conferencing or other audio-visual means are validly counted for the purpose of quorum under Section 174.
3. Necessary safeguards (storing recordings, roll call identifying director and location, ensuring secrecy) must be followed by the chairperson.
Conclusion: Mr. Alok's participation through video conferencing from the US is legally valid and counts toward the statutory quorum.`}]}],W0=()=>{const[e,t]=A.useState(z0),[a,n]=A.useState(0),[r,o]=A.useState("mcqs"),[s,l]=A.useState({}),[c,u]=A.useState({}),[h,g]=A.useState({}),m=e[a]||e[0],v=A.useMemo(()=>m.mcqs.map(p=>lt(p)),[m]),x=(p,d,f)=>{s[p]||(l(y=>({...y,[p]:d})),d===f?z.playCorrect():z.playWrong())},b=p=>{const d=c[p.id]||"";if(d.length<10)return;const f=ss.evaluateAnswer(p,d);g(y=>({...y,[p.id]:f})),f.percentage>=60?z.playVictory():z.playWrong()},P=()=>{const p=w.generateDynamicCaseStudy();t(d=>[...d,p]),n(e.length),l({}),u({}),g({})};return i.jsxs("div",{className:"max-w-7xl mx-auto px-4 py-8 space-y-6",children:[i.jsxs("div",{className:"bg-slate-800 rounded-2xl border border-slate-700 p-5 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4",children:[i.jsxs("div",{children:[i.jsxs("div",{className:"flex items-center gap-2 text-xs font-bold text-amber-400 uppercase tracking-wider mb-1",children:[i.jsx(et,{className:"w-4 h-4"}),i.jsx("span",{children:"Integrated Case Scenario Lab (15-30 Marks ICAI Pattern)"})]}),i.jsx("h2",{className:"text-xl font-bold text-white leading-tight",children:m.title}),i.jsxs("span",{className:"text-xs text-slate-400 font-medium",children:["Source: ",m.source]})]}),i.jsxs("div",{className:"flex flex-wrap items-center gap-2",children:[e.map((p,d)=>i.jsxs("button",{onClick:()=>{n(d),l({}),g({})},className:`px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all ${a===d?"bg-blue-600 text-white border-blue-500 shadow-md":"bg-slate-900 text-slate-400 border-slate-700 hover:text-white"}`,children:["Case #",d+1]},p.id)),i.jsxs("button",{onClick:P,className:"flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white shadow-md shadow-amber-950/40 transition-all active:scale-95",title:"Gen s of Auditor",keyRule:"CA in practice; Officer/employee disqualified; Partner/relative holding securities > Rs. 1 lakh face value in company disqualified; Indebted > Rs. 5 lakhs.",subjectId:"p2_law"},{id:"ca_sec_123",category:"Company Law",code:"Section 123",title:"Declaration and Payment of Dividend",keyRule:"Declared out of current year profits after depreciation, or past reserves subject to Rule 3 (Max rate <= avg of 3 yrs; Max withdrawal <= 10% of capital+free reserves).",subjectId:"p2_law"},{id:"ca_sec_73",category:"Company Law",code:"Section 73",title:"Acceptance of Deposits from Members",keyRule:"Requires circular to members, deposit repayment reserve (min 20% maturing in year), credit rating, and special resolution.",subjectId:"p2_law"},{id:"ca_sec_77",category:"Company Law",code:"Section 77",title:"Registration of Charges with ROC",keyRule:"Duty to register within 30 days of creation. Condonation by Registrar up to additional 30 days, or further 60 days on ad-valorem fees.",subjectId:"p2_law"},{id:"ca_sec_103",category:"Company Law",code:"Section 103",title:"Quorum for General Meetings",keyRule:"Public Co: 5 members if <= 1000; 15 members if 1000 to 5000; 30 members if > 5000 personally present. Private Co: 2 members.",subjectId:"p2_law"},{id:"ca_sec_138",category:"Company Law",code:"Section 138",title:"Internal Audit",keyRule:"Mandatory for every listed company; unlisted public with turnover >= 200 Cr or deposits >= 25 Cr or loans >= 100 Cr or capital >= 50 Cr; private with turnover >= 200 Cr or loans >= 100 Cr.",subjectId:"p2_law"},{id:"it_sec_6",category:"Income Tax",code:"Section 6(1)",title:"Residential Status of an Individual",keyRule:"Resident if in India >= 182 days in PY, OR >= 60 days in PY and >= 365 days in 4 preceding PYs (subject to Indian crew/citizen abroad relaxation to 120/182 days).",subjectId:"p3_tax"},{id:"it_sec_115bac",category:"Income Tax",code:"Section 115BAC",title:"Default Concessional Tax Regime",keyRule:"Default tax slab from AY 2024-25. Standard deduction Rs. 75,000 in salary; Family pension deduction Rs. 25,000. Forgoes HRA, 80C, 80D, 24(b) self-occupied interest.",subjectId:"p3_tax"},{id:"it_sec_40a3",category:"Income Tax",code:"Section 40A(3)",title:"Disallowance of Cash Payments > Rs. 10,000",keyRule:"Payment to a person in a single day exceeding Rs. 10,000 otherwise than by account payee cheque/draft/ECS is 100% disallowed (Rs. 35,000 for goods carriage plying).",subjectId:"p3_tax"},{id:"it_sec_44ab",category:"Income Tax",code:"Section 44AB",title:"Mandatory Tax Audit Limits",keyRule:"Business turnover > Rs. 1 Crore (enhanced to Rs. 10 Crores if cash receipts & cash payments do not exceed 5%). Profession gross receipts > Rs. 50 Lakhs.",subjectId:"p3_tax"},{id:"it_sec_54",category:"Income Tax",code:"Section 54",title:"Capital Gain Exemption on Residential House",keyRule:"Transfer of Long-Term Residential House; purchase 1 year before or 2 years after, or construct within 3 years. Exemption capped at Rs. 10 Crores.",subjectId:"p3_tax"},{id:"it_sec_194c",category:"Income Tax",code:"Section 194C",title:"TDS on Payments to Contractors",keyRule:"1% for Individual/HUF contractors, 2% for other contractors. Threshold: Single contract > Rs. 30,000 or aggregate > Rs. 1,00,000 in FY.",subjectId:"p3_tax"},{id:"it_sec_194j",category:"Income Tax",code:"Section 194J",title:"TDS on Professional & Technical Services",keyRule:"10% on professional fees/royalty; 2% for FTS/call center operators. Threshold: Rs. 30,000 per category per annum.",subjectId:"p3_tax"},{id:"it_sec_50c",category:"Income Tax",code:"Section 50C",title:"Stamp Duty Value as Full Value of Consideration",keyRule:"If Stamp Duty Value (SDV) exceeds 110% of declared consideration of land/building, the SDV is deemed full value of consideration for Capital Gains.",subjectId:"p3_tax"},{id:"gst_sec_16",category:"GST",code:"Section 16(2)",title:"Conditions for Claiming Input Tax Credit (ITC)",keyRule:"Must possess Tax Invoice; tax communicated in GSTR-2B; received goods/services; supplier paid tax to Govt; recipient filed GSTR-3B; payment within 180 days.",subjectId:"p3_tax"},{id:"gst_sec_17_5",category:"GST",code:"Section 17(5)",title:"Blocked Input Tax Credit",keyRule:"Motor vehicles for seating <= 13 persons (unless in business of supply/training); Food and beverages, outdoor catering, beauty treatment; Goods lost, stolen, or gifted.",subjectId:"p3_tax"},{id:"gst_sec_9_3",category:"GST",code:"Section 9(3) & 9(4)",title:"Reverse Charge Mechanism (RCM)",keyRule:"Recipient liable to pay GST directly for GTA services (unless forward charge elected), legal services by advocate, sponsorship, director services to company.",subjectId:"p3_tax"},{id:"gst_sec_12",category:"GST",code:"Section 12 & 13",title:"Time of Supply of Goods & Services",keyRule:"Goods: Date of invoice or last date invoice required to be issued (earliest). Services: Date of invoice or date of payment, whichever earlier.",subjectId:"p3_tax"},{id:"sa_200",category:"Standards on Auditing (SA)",code:"SA 200",title:"Overall Objectives of the Independent Auditor",keyRule:"Obtain reasonable assurance whether financial statements as a whole are free from material misstatement; conduct audit in accordance with SAs, professional skepticism.",subjectId:"p5_audit"},{id:"sa_315",category:"Standards on Auditing (SA)",code:"SA 315",title:"Identifying and Assessing the Risks of Material Misstatement",keyRule:"Through understanding the entity and its environment, internal controls, IT environment; assess risk at Financial Statement level and Assertion level.",subjectId:"p5_audit"},{id:"sa_500",category:"Standards on Auditing (SA)",code:"SA 500",title:"Audit Evidence",keyRule:"Auditor must obtain Sufficient Appropriate Audit Evidence (SAAE). Sufficiency = quantity; Appropriateness = quality (relevance & reliability).",subjectId:"p5_audit"},{id:"sa_505",category:"Standards on Auditing (SA)",code:"SA 505",title:"External Confirmations",keyRule:"Auditor maintains control over confirmation requests (selecting items, preparing and sending directly to confirming parties, receiving responses).",subjectId:"p5_audit"},{id:"sa_570",category:"Standards on Auditing (SA)",code:"SA 570",title:"Going Concern Assumption",keyRule:"Evaluate appropriateness of management use of going concern; assess material uncertainty. If adequate disclosure given: Material Uncertainty Related to Going Concern paragraph.",subjectId:"p5_audit"},{id:"sa_705",category:"Standards on Auditing (SA)",code:"SA 705",title:"Modifications to the Opinion in the Independent Auditor Report",keyRule:"Qualified Opinion: Material but NOT pervasive. Adverse Opinion: Misstatement is Material AND Pervasive. Disclaimer of Opinion: Inability to obtain SAAE is Material AND Pervasive.",subjectId:"p5_audit"},{id:"sa_701",category:"Standards on Auditing (SA)",code:"SA 701",title:"Communicating Key Audit Matters (KAM)",keyRule:"Mandatory for listed entities. Matters communicated with TCWG that in auditor judgment were of most significance in audit of current period financial statements.",subjectId:"p5_audit"},{id:"as_2",category:"Accounting Standards (AS)",code:"AS 2",title:"Valuation of Inventories",keyRule:"Valued at Lower of Cost or Net Realisable Value (NRV). Cost excludes abnormal waste, storage costs unless necessary, and administrative overheads.",subjectId:"p1_adv_acc"},{id:"as_10",category:"Accounting Standards (AS)",code:"AS 10",title:"Property, Plant and Equipment (PPE)",keyRule:"Cost includes purchase price, import duties, directly attributable site prep/delivery costs, and initial estimate of dismantling/restoration obligations.",subjectId:"p1_adv_acc"},{id:"as_16",category:"Accounting Standards (AS)",code:"AS 16",title:"Borrowing Costs",keyRule:"Capitalise borrowing costs directly attributable to acquisition, construction or production of Qualifying Asset (takes substantial period to get ready for intended use).",subjectId:"p1_adv_acc"},{id:"as_14",category:"Accou perCode:"P-1",title:"Advanced Accounting",emoji:"🧮",color:"from-blue-600 to-indigo-700",tagline:"Master Accounting Standards, Schedule III & Corporate Restructuring from absolute scratch.",whatIsIt:"In CA Foundation, you learned basic bookkeeping (Debit/Credit, Trial Balance, Sole Proprietor accounts). In CA Intermediate Paper 1, you step into the corporate world: how companies report their accounts under ICAI Accounting Standards (AS) and the Companies Act 2013 (Schedule III).",realWorldAnalogy:'Think of Accounting Standards as the "Grammar Rules of Business". If every company wrote their financial reports using their own invented rules, investors could never compare Apple and Microsoft, or Reliance and Tata. Standards force everyone to speak the exact same financial language.',corePillars:[{title:"Pillar 1: Accounting Standards (AS Framework)",description:"ICAI issues mandatory rules for specific topics: AS 2 (Inventory), AS 10 (Property, Plant & Equipment), AS 16 (Borrowing Costs), AS 19 (Leases), AS 20 (Earnings Per Share), and AS 22 (Taxes on Income).",keyRule:"Always start AS questions by quoting the Standard number, its principle, and whether the company followed it."},{title:"Pillar 2: Schedule III Financial Statements",description:"Companies cannot make the old T-shaped Profit & Loss or Balance Sheet. They must use the modern vertical format: Equity & Liabilities at the top, followed by Assets at the bottom.",keyRule:"Assets = Equity + Non-Current Liabilities + Current Liabilities. Both sides must balance precisely!"},{title:"Pillar 3: Corporate Restructuring (Buyback & Amalgamation)",description:"When companies buy back their own shares (Sec 68), merge together (AS 14 Amalgamation), or restructure sick companies (Internal Reconstruction with a Capital Reduction Account).",keyRule:"In Internal Reconstruction, sacrifices by shareholders/lenders credit the Capital Reduction Account to wipe out accumulated losses."}],jargonBuster:[{term:"Accounting Standard (AS)",meaning:"Authoritative rules issued by ICAI on how to recognize, measure, and disclose financial transactions."},{term:"Schedule III",meaning:"The mandatory statutory format under the Companies Act 2013 for presenting company Balance Sheets and P&L."},{term:"Qualifying Asset (AS 16)",meaning:"An asset that necessarily takes a substantial period of time (ordinarily 12+ months) to get ready for its intended use or sale."},{term:"NRV (Net Realisable Value)",meaning:"Estimated selling price minus any estimated completion or selling expenses (AS 2)."}],goldenRules:["Golden Rule 1: AS 2 Inventory is valued at the LOWER of Cost or Net Realisable Value (NRV). Never at market price if it exceeds cost!","Golden Rule 2: AS 16 allows interest on loans to be added to asset cost ONLY during active construction, not during abnormal flood/strike halts.","Golden Rule 3: Abnormal spoilage or idle labor waste is NEVER added to inventory cost; it goes directly to the P&L account as a loss.","Golden Rule 4: Buyback under Sec 68 is capped at 10% of (Paid-up Capital + Free Reserves + Securities Premium) by Board Resolution, or 25% by Special Resolution.","Golden Rule 5: Always prepare clear Working Notes. ICAI awards up to 30% marks for Working Notes even if your final answer has arithmetic errors."],checkpoints:[{id:"acc_chk_1",question:"Under AS 2, if inventory cost is ₹ 1,00,000 and estimated Net Realisable Value is ₹ 85,000, what value should be shown in the Balance Sheet?",options:[{id:"a",text:"₹ 85,000 (Lower of Cost or NRV)"},{id:"b",text:"₹ 1,00,000 (Historical Cost)"},{id:"c",text:"₹ 1,85,000 (Sum of both)"},{id:"d",text:"₹ 92,500 (Average)"}],correctId:"a",explanation:"Correct! AS 2 mandates valuation at the lower of Cost and Net Realisable Value. Prudence requires recognizing the ₹ 15,000 write-down immediately."},{id:"acc_chk_2",question:'What is a "Qualifying Asset" under AS 16 Borrowing Costs?',options:[{id:"a",text:"Any asset purchased for cash in 1 day"},{id:"b",text:"An asset that necessarily takes a substantial period of time to get ready for its intended use or sale"},{id:"c",text:"Any listed company equity share"},{id:"d",text:"Inventory meant for immediate daily retail sale"}],correctId:"b",explanation:"Spot on! AS 16 defines a qualifying asset as one requiring a substantial period (ordinarily 12+ months) to construct, such as a factory plant or building."}]},{subjectId:"p2_law",paperCode:"P-2",title:"Corporate & Other Laws",emoji:"⚖️",color:"from-amber-600 to-rose-700",tagline:"Understand the Companies Act 2013, Meetings, CSR, and Business Regulations without legal overwhelm.",whatIsIt:"This paper teaches you the legal framework governing companies in India (Companies Act 2013 Sections 1 to 148), along with the Limited Liability Partnership (LLP) Act, the Foreign Exchange Management Act (FEMA), and the General Clauses Act.",realWorldAnalogy:'Think of Company Law as the "Rulebook of a Football Match". The Shareholders are the fans who own the club; the Directors are the team captains and coach who run the match; the Companies Act is the referee ensuring fair play, protecting minority fans, and preventing fraud.',corePillars:[{title:"Pillar 1: Incorporation & Capital (Sec 1 to 72)",description:"How a company is born (ROC registration), how it issues shares (Prospectus, Private Placement, Bonus Shares, Rights Issue), and the difference between Equity and Preference shares.",keyRule:"A company is an artificial legal person with perpetual succession, separate from its shareholders (Salomon v. Salomon doctrine)."},{title:"Pillar 2: Management & Meetings (Sec 88 to 122)",description:"Annual General Meetings (AGM), Extra-Ordinary General Meetings (EGM), Notice requirements (21 clear days), Quorum rules, and voting procedures (Show of hands, Poll, Postal ballot).",keyRule:"For public company AGMs, statutory quorum depends on member count: <=1000: 5 members; 1001-5000: 15 members; >5000: 30 members personally present."},{title:"Pillar 3: CSR & Accounts of Companies (Sec 128 to 137)",description:"Books of accounts must be kept on accrual basis for 8 years. Corporate Social Responsibility (CSR Sec 135) mandates companies with Net Profit >= 5 Cr (or Turnover >= 1000 Cr / Net Worth >= 500 Cr) to spend 2% of average net profits on social causes.",keyRule:'Unspent ongoing CSR funds must be moved to an "Unspent CSR Account" within 30 days of financial year end.'}],jargonBuster:[{term:"Ordinary Resolution (OR)",meaning:"Passed when votes cast in favor exceed votes cast against (> 50%)."},{term:"Special Resolution (SR)",meaning:"Passed when votes cast in favor are at least 3 times the votes cast against (>= 75%)."},{term:"Quorum",meaning:"The minimum number of members legally required to be personally present to conduct a valid meeting."},{term:"ROC (Registrar of Companies)",meaning:"The government office under the Ministry of Corporate Affairs (MCA) where company records and filings are registered."}],goldenRules:["Golden Rule 1: Notice of General Meeting requires 21 CLEAR days (exclude day of sending and day of meeting + 48 hours for post).","Golden Rule 2: Shorter notice for an AGM requires consent of not less than 95% of members entitled to vote thereat.","Golden Rule 3: For public company quorum under Sec 103: proxies are NOT counted; members must be personally present.","Golden Rule 4: Dividend must be deposited in a scheduled bank within 5 days of declaration, and paid within 30 days.",'Golden Rule 5: State the Law first ("As per Section..."), apply it to the facts given, and end with a crisp final conclusion.'],checkpoints:[{id:"law_chk_1",question:"Under Section 103 of Companies Act 2013, what is the quorum for an AGM of a public company having 6,000 members?",options:[{id:"a",text:"30 members personally present"},{id:"b",text:"5 members personally present"},{id:"c",text:"15 members personally present"},{id:"d",text:"50 members including proxies"}],correctId:"a",explanation:"Correct! When member count exceeds 5,000 in a public company, the statutory quorum is 30 members personally present."},{id:"law_chk_2",question:"What percentage of 3-year average net profit must a qualifying company spend on CSR under Section 135?",options:[{id:"a",text:"2%"},{id:"b",text:"5%"},{id:"c",text:"1%"},{id:"d",text:"10%"}],correctId:"a",explanation:"Exactly! Section 135(5) requires spending at least 2% of the average net profits made during the 3 immediately preceding financial years."}]},{subjectId:"p3_tax",paperCode:"P-3",title:"Taxation (Direct Tax & GST)",emoji:"🧾",color:"from-emerald-600 to-teal-800",tagline:"Learn how Income Tax and GST work in the Indian economy from fundamentals to exam mastery.",whatIsIt:"Taxation is split into two halves: Direct Tax (Income Tax Act 1961 - 50 Marks) where you calculate tax on personal and business income; and Indirect Tax (GST - 50 Marks) where you learn how Goods and Services Tax is levied across the supply chain.",realWorldAnalogy:'Think of Income Tax as "Paying toll based on how much treasure you collected this year", while GST is "Paying a small toll at each stage of a factory pipeline, but getting a refund for tolls paid earlier (Input Tax Credit)".',corePillars:[{title:"Pillar 1: Previous Year (PY) vs Assessment Year (AY)",description:"The year in which you earn money is the Previous Year (e.g. FY 2023-24). The following year in which your income is evaluated and taxed is the Assessment Year (AY 2024-25).",keyRule:"You earn in the PY, and pay tax assessed in the AY."},{title:"Pillar 2: The 5 Heads of Income",description:"All taxable earnings fit into 5 buckets: 1. Salaries; 2. House Property (rental value); 3. PGBP (Business & Profession profit); 4. Capital Gains (selling property, shares); 5. Income from Other Sources (interest, dividend, lottery).",keyRule:"Gross Total Income (GTI) = Sum of all 5 Heads. Total Income = GTI minus Chapter VI-A deductions."},{title:"Pillar 3: GST Mechanics & Input Tax Credit (ITC)",description:"GST is a destination-based consumption tax. Intra-state supply (within same state) attracts CGST + SGST. Inter-state supply (between two states) attracts IGST. A registered business pays tax only on the value added because it claims ITC on purchases.",keyRule:"Under Section 17(5), ITC is blocked on motor vehicles for passenger transport with capacity <= 13 seats."}],jargonBuster:[{term:"Section 115BAC",meaning:"The default concessional income tax regime for individuals with lower tax slabs but no traditional deductions (like 80C, 80D)."},{term:"Standard Deduction (Sec 16(ia))",meaning:"A flat deduction allowable from salary income (available under both old and new default tax regimes)."},{term:"Reverse Charge Mechanism (RCM)",meaning:"A GST mechanism where the buyer/recipient of goods/services is legally liable to pay GST instead of the seller."},{term:"Input Tax Credit (ITC)",meaning:"The credit of GST paid on purchases of goods/services that can be set off against GST liability on sales."}],goldenRules:["Golden Rule 1: Always check whether the question specifies the Default Tax Regime (Sec 115BAC) or the Old Optional Regime.","Golden Rule 2: In Salary, Standard Deduction under Section 16(ia) is available under Section 115BAC as well.","Golden Rule 3: For residential status under Sec 6(1): Resident if in India >= 182 days in the PY, or (60 days in PY + 365 days in 4 preceding years).","Golden Rule 4: In GST, intra-state = CGST + SGST (split 50:50). Inter-state = full IGST.","Golden Rule 5: Always calculate taxable income under each Head separately and show computation steps clearly."],checkpoints:[{id:"tax_chk_1",question:"Under the default new tax regime under Section 115BAC, which of the following deductions is permissible to a salaried employee?",options:[{id:"a",text:"Standard Deduction under Section 16(ia)"},{id:"b",text:"Deduction for PPF under Section 80C"},{id:"c",text:"Mediclaim insurance under Section 80D"},{id:"d",text:"House Rent Allowance (HRA) exemption"}],correctId:"a",explanation:"Correct! From AY 2024-25, Standard Deduction under Section 16(ia) is specifically allowable under Section 115BAC default regime."},{id:"tax_chk_2",question:"When a supplier in Mumbai (Maharashtra) sells goods to a buyer in Pune (Maharashtra), which GST is charged?",options:[{id:"a",text:"CGST and SGST (Intra-state)"},{id:"b",text:"IGST only"},{id:"c",text:"Customs Duty"},{id:"d",text:"No GST is charged within the same state"}],correctId:"a",explanation:"Bingo! Supplies within the same state are Intra-State supplies, attracting both Central GST (CGST) and State GST (SGST) in equal proportion."}]},{subjectId:"p4_costing",paperCode:"P-4",title:"Cost & Management Accounting",emoji:"📊",color:"from-indigo-600 to-blue-800",tagline:"Understand how products are priced, costs are controlled, and management decisions are made.",whatIsIt:"While financial accountants report historical profits to external tax authorities and shareholders, cost accountants help factory managers calculate the exact cost to produce one unit, eliminate waste, and make decisions like pricing and make-or-buy.",realWorldAnalogy:"Think of running a coffee stall. If your shop rent is ₹ 10,000/month (Fixed Cost) and milk/coffee beans cost ₹ 20 per cup (Variable Cost), selling at ₹ 50 per cup leaves ₹ 30 per cup (Contribution). You need to sell 334 cups just to pay the rent (Break-Even Point). Every cup after that is pure profit!",corePillars:[{title:"Pillar 1: Cost Classifications & Cost Sheet",description:"Direct Material + Direct Labour + Direct Expenses = Prime Cost. Adding Factory Overheads gives Factory Cost. Adding Office & Selling Overheads gives Total Cost of Sales.",keyRule:"Direct costs trace directly to the product. Indirect costs (overheads) must be absorbed or allocated."},{title:"Pillar 2: Marginal Costing & Decision Making",description:"Separating costs into Fixed and Variable. Contribution = Sales - Variable Cost. Profit = Contribution - Fixed Cost. Used for decisions like accepting special export orders and key limiting factors.",keyRule:"Fixed costs are sunk in the short term. Any order offering a price higher than incremental variable cost increases total profit."},{title:"Pillar 3: Standard Costing & Variances",description:"Comparing predetermined benchmark costs (Standard) with actual costs to spot inefficiencies. Material Cost Variance = Price Variance + Usage Variance. Labor Cost Variance = Rate Variance + Efficiency Variance.",keyRule:"Variance = Standard Cost - Actual Cost. Positive is Favourable (F); Negative is Adverse (A)."}],jargonBuster:[{term:"Break-Even Point (BEP)",meaning:"The sales volume (in units or value) at which total revenue equals total cost, resulting in zero profit and zero loss."},{term:"Contribution",meaning:"The surplus generated from sales after deducting all variable costs (Sales - Variable Cost = Fixed Cost + Profit)."},{term:"P/V Ratio (Profit Volume Ratio)",meaning:"The ratio of contribution to sales: (Contribution / Sales) × 100."},{term:"Margin of Safety (MOS)",meaning:"The excess of actual sales over break-even sales: Actual Sales - Break-Even Sales."}],goldenRules:["Golden Rule 1: Break-Even Point (in units) = Fixed Cost / Contribution per unit.","Golden Rule 2: Break-Even Point (in value) = Fixed Cost / P/V Ratio.","Golden Rule 3: Margin of Safety = Actual Sales - Break Even Sales, or Profit / P/V Ratio.","Golden Rule 4: P/V Ratio is also equal to: (Change in Profit / Change in Sales) × 100.","Golden Rule 5: Pure financial charges (like interest on debentures, income tax, dividends) are NEVER included in a Cost Sheet."],checkpoints:[{id:"cost_chk_1",question:"If Selling Price is ₹ 100, Variable Cost is ₹ 60, and Fixed Cost is ₹ 2,00,000, what is the Break-Even Point in units?",options:[{id:"a",text:"5,000 units (₹ 2,00,000 / ₹ 40)"},{id:"b",text:"2,000 units"},{id:"c",text:"3,333 units"},{id:"d",text:"10,000 units"}],correctId:"a",explanation:"Spot on! Contribution per unit = ₹ 100 - ₹ 60 = ₹ 40. BEP (units) = Fixed Cost / Contribution = 2,00,000 / 40 = 5,000 units."},{id:"cost_chk_2",question:"Which of the following items is strictly EXCLUDED from the Cost Sheet?",options:[{id:"a",text:"Debenture Interest and Income Tax"},{id:"b",text:"Direct Factory Wages"},{id:"c",text:"Factory Electricity"},{id:"d",text:"Raw Material Freight"}],correctId:"a",explanation:"Correct! Pure financial items like debenture interest, dividends, and income tax are appropriations of profit and never part of product cost."}]},{subjectId:"p5_audit",paperCode:"P-5",title:"Auditing and Ethics",emoji:"🛡️",color:"from-cyan-600 to-teal-800",tagline:"Learn the auditor’s role as an independent watchdog, verifying financial truth with professional skepticism.",whatIsIt:'Auditing is the independent examination of financial statements by a qualified Chartered Accountant to express an opinion on whether they reflect a "True and Fair View" in accordance with the law and accounting standards.',realWorldAnalogy:'Think of an Auditor as an "Independent Food Safety Inspector". The chef (company management) cooked the dish (financial statements). The inspector does not cook the food, but tests samples, checks the kitchen hygiene, and issues a certificate so customers can eat with confidence.',corePillars:[{title:"Pillar 1: Professional Skepticism & Independence",description:"An auditor must maintain an attitude of professional skepticism: being alert to conditions that may indicate possible misstatement due to error or fraud, and critically questioning audit evidence.",keyRule:"The auditor is a watchdog, not a bloodhound (Kingston Cotton Mill case), but cannot turn a blind eye to red flags."},{title:"Pillar 2: Standards on Auditing (SA Series)",description:"Mandatory standards issued by ICAI: SA 200 (Overall Objectives), SA 210 (Agreed Terms), SA 500 (Audit Evidence), SA 501 (Inventory Verification), SA 505 (External Confirmations), SA 700/705 (Audit Opinions).",keyRule:"Audit evidence must be SUFFICIENT (quantity) and APPROPRIATE (quality: relevance & reliability)."},{title:"Pillar 3: The 4 Types of Audit Opinions (SA 700/705)",description:'1. Unmodified (Clean): Financial statements give true and fair view. 2. Qualified ("Except for"): Material but not pervasive. 3. Adverse: Material AND pervasive misstatement. 4. Disclaimer: Unable to obtain evidence and effect is material and pervasive.',keyRule:"Pervasive means misstatements affect substantially the whole financial statements, not just an isolated item."}],jargonBuster:[{term:"True and Fair View",meaning:"The financial statements are free from material misstatements and accurately reflect the company financial reality."},{term:"Materiality (SA 320)",meaning:"Misstatements are material if they could reasonably be expected to influence economic decisions of users."},{term:"SQC 1 (Quality Control)",meaning:"Requires audit firms to retain audit documentation (working paper files) for a minimum of 7 years."},{term:"TCWG",meaning:"Those Charged With Governance (e.g. Board of Directors / Audit Committee)."}],goldenRules:["Golden Rule 1: External audit evidence (from independent 3rd parties like bank statements or debtor letters) is more reliable than internal evidence.","Golden Rule 2: Oral representations from management alone are never a substitute for sufficient appropriate audit evidence.","Golden Rule 3: If management refuses permission to send external debtor confirmation, investigate reasons first under SA 505 before modifying opinion.","Golden Rule 4: Retention period of audit working papers under SQC 1 is 7 years (Companies Act requires 8 years for company books).","Golden Rule 5: State the Standard on Auditing (SA) number in the first line of your answer to secure maximum marks."],checkpoints:[{id:"aud_chk_1",question:"When the auditor has obtained sufficient evidence that misstatements are BOTH material and pervasive, which opinion is issued under SA 705?",options:[{id:"a",text:"Adverse Opinion"},{id:"b",text:"Qualified Opinion"},{id:"c",text:"Disclaimer of Opinion"},{id:"d",text:"Unmodified Opinion"}],correctId:"a",explanation:"Correct! When evidence IS obtained and misstatements are both material and pervasive, an Adverse Opinion is issued."},{id:"aud_chk_2",question:"As per SQC 1, what is the minimum retention period for audit documentation working papers?",options:[{id:"a",text:"7 years from the date of the audit report"},{id:"b",text:"3 years"},{id:"c",text:"5 years"},{id:"d",text:"10 years"}],correctId:"a",explanation:"Spot on! SQC 1 mandates retaining audit documentation for no shorter than seven years from the date of the auditor’s report."}]},{subjectId:"p6_fm_sm",paperCode:"P-6",title:"Financial Management & Strategic Management",emoji:"📈",color:"from-purple-600 to-indigo-900",tagline:"Master corporate financing decisions, capital budgeting, and strategic growth matrices.",whatIsIt:"Paper 6 combines the financial engine of a business with its long-term strategic brain: Financial Management (50 Marks) focuses on raising and investing capital to maximize shareholder wealth; Strategic Management (50 Marks) focuses on competitive advantage and growth.",realWorldAnalogy:'Think of FM as "The Fuel & Engine of an Airplane" (making sure you have enough cash to fly without running out or paying too much for fuel). Think of SM as "The Flight Navigation & Destination" (choosing which route to fly to beat rival airlines and avoid storms).',corePillars:[{title:"Pillar 1: Time Value of Money & Capital Budgeting",description:"Money received today is worth more than money received in the future due to inflation, risk, and earning capacity. Capital budgeting techniques (NPV, IRR, Payback) help choose long-term projects.",keyRule:"Net Present Value (NPV) = Present Value of Cash Inflows - Initial Investment. Accept projects where NPV > 0!"},{title:"Pillar 2: Leverages (Operating & Financial)",description:"Operating Leverage (DOL) measures the presence of fixed operating costs. Financial Leverage (DFL) measures the presence of fixed interest charges on debt.",keyRule:"Degree of Combined Leverage (DCL) = DOL × DFL = (% change in EPS) / (% change in Sales)."},{title:"Pillar 3: Strategic Tools (SWOT & Ansoff Matrix)",description:"Strategic Management tools: SWOT (internal Strengths/Weaknesses vs external Opportunities/Threats), Porter 5 Forces, and the Ansoff Matrix (Market Penetration, Market Development, Product Development, Diversification).",keyRule:"Market Development = Selling existing products in NEW markets. Diversification = NEW products in NEW markets."}],jargonBuster:[{term:"WACC (Weighted Average Cost of Capital)",meaning:"The average rate of return a company must pay to all its security holders (debt, preference, equity)."},{term:"EBIT-EPS Analysis",meaning:"Analyzing how different capital structures (debt vs equity) impact earnings per share at various operating profit levels."},{term:"Core Competence",meaning:"A unique collective learning or capability in an organization that provides a sustainable competitive edge (Prahalad & Hamel 1990)."},{term:"Value Chain (Michael Porter)",meaning:"The series of internal business activities (inbound logistics, operations, marketing, service) that create customer value."}],goldenRules:["Golden Rule 1: DCL is the product of DOL and DFL ($DCL = DOL 	imes DFL$), never the sum!","Golden Rule 2: DFL = EBIT / (EBIT - Interest - Preference Dividend/(1-t)).","Golden Rule 3: In Capital Budgeting, depreciation is a non-cash expense; add back depreciation to profit after tax to find Cash Flow After Tax (CFAT).","Golden Rule 4: In Ansoff Matrix: Existing Product + Existing Market = Market Penetration; Existing Product + New Market = Market Development.","Golden Rule 5: Always state the business objective: FM aims for Shareholder Wealth Maximization (not just profit maximization)."],checkpoints:[{id:"fm_chk_1",question:"If a company has DOL = 2.0 and DFL = 1.5, what is the Degree of Combined Leverage (DCL)?",options:[{id:"a",text:"3.0 (2.0 × 1.5)"},{id:"b",text:"3.5"},{id:"c",text:"0.5"},{id:"d",text:"2.5"}],correctId:"a",explanation:"Correct! Degree of Combined Leverage is the product of Operating Leverage and Financial Leverage: 2.0 × 1.5 = 3.0."},{id:"fm_chk_2",question:"According to the Ansoff Matrix, introducing an existing product into a brand new geographic country is called:",options:[{id:"a",text:"Market Development"},{id:"b",text:"Market Penetration"},{id:"c",text:"Product Development"},{id:"d",text:"Diversification"}],correctId:"a",explanation:"Spot on! Selling existing products in new geographic or demographic markets is Market Development."}]}],tm=({isOpen:e,onClose:t,onStartBeginnerPractice:a,initialSubjectId:n})=>{const[r,o]=A.useState(n||Fn[0].subjectId),[s,l]=A.useState("primer"),[c,u]=A.useState({});if(A.useEffect(()=>{n&&o(n)},[n]),!e)return null;const h=Fn.find(m=>m.subjectId===r)||Fn[0],g=(m,v,x)=>{c[m]||(u(b=>({...b,[m]:v})),v===x?z.playCorrect():z.playWrong())};return i.jsx("div",{className:"fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5 overflow-y-auto",children:i.jsxs("div",{className:"bg-slate-900 border border-slate-700 rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200",children:[i.jsxs("div",{className:"p-4 sm:p-6 bg-gradient-to-r from-blue-950/80 via-slate-900 to-indigo-950/80 border-b border-slate-800 flex items-center justify-between gap-4",children:[i.jsxs("div",{className:"flex items-center gap-3",children:[i.jsx("div",{className:"w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-lg text-2xl shrink-0",children:"🌱"}),i.jsxs("div",{children:[i.jsxs("div",{className:"inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-950 text-emerald-300 border border-emerald-800/80 mb-1",children:[i.jsx(F
